<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Games</title>
<style>
  :root {
    --bg: #f2f4f5;
    --surface: #ffffff;
    --text: #1b1d20;
    --muted: #6b7178;
    --accent: #2f6bff;
    --shadow: rgba(20, 30, 50, .14);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1d21;
      --surface: #272a30;
      --text: #f1f3f5;
      --muted: #9aa1a9;
      --accent: #6c97ff;
      --shadow: rgba(0, 0, 0, .45);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  header { padding: 28px 24px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0; font-size: 1.6rem; font-weight: 800; }
  .tools { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search {
    width: 100%; max-width: 360px; padding: 10px 14px;
    border: 2px solid transparent; border-radius: 10px;
    background: var(--surface); color: var(--text); font: inherit;
  }
  .search:focus { outline: none; border-color: var(--accent); }

  .row-title { max-width: 1200px; margin: 18px auto 0; padding: 0 24px; font-size: 1.1rem; font-weight: 700; }
  .grid {
    max-width: 1200px; margin: 0 auto; padding: 12px 24px 48px;
    display: grid; gap: 18px;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  }
  .game {
    all: unset; cursor: pointer; display: block;
    border-radius: 12px; padding: 8px; transition: background .15s;
  }
  .game:hover { background: var(--surface); }
  .game:focus-visible { outline: 3px solid var(--accent); }
  .icon {
    width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden;
    background: var(--surface); box-shadow: 0 2px 8px var(--shadow);
    display: flex; align-items: center; justify-content: center;
    font-size: 3rem; font-weight: 800; color: var(--muted);
  }
  .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .name {
    margin-top: 8px; font-weight: 700; font-size: .95rem; line-height: 1.25;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .empty { max-width: 1200px; margin: 0 auto; padding: 0 24px; color: var(--muted); }

  /* Game player */
  #player { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; }
  #player.open { display: flex; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--surface); box-shadow: 0 1px 6px var(--shadow); }
  .bar .title { font-weight: 800; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn {
    border: 0; border-radius: 8px; padding: 8px 14px; font: inherit; font-weight: 700;
    background: var(--accent); color: #fff; cursor: pointer; text-decoration: none;
  }
  .btn.alt { background: transparent; color: var(--text); border: 2px solid var(--shadow); }
  #frame { flex: 1; width: 100%; border: 0; background: #000; }
</style>
</head>
<body>

<header>
  <h1>Games</h1>
  <div class="tools">
    <input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games">
    <button class="btn" id="blankSite">Open site in about:blank</button>
  </div>
</header>

<div class="row-title">All games</div>
<main class="grid" id="grid"></main>
<p class="empty" id="empty" hidden>No games match your search.</p>

<div id="player" role="dialog" aria-modal="true">
  <div class="bar">
    <button class="btn alt" id="back">Back</button>
    <span class="title" id="ptitle"></span>
    <button class="btn alt" id="blankGame">Open in about:blank</button>
    <a class="btn" id="newtab" target="_blank" rel="noopener">Open in new tab</a>
  </div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
</div>

<script>
  /* ============ EDIT THIS PART ============
     Add one line per game:
       name: Hollow Knight - webport
       icon: "icons/hollow-knight.webp"
       url:  "https://293701987.github.io/test/"
     OPEN_MODE: "embed" = plays inside this site (with a "Open in new tab" button)
                "tab"   = opens the link in a new tab
  ======================================== */
  const OPEN_MODE = "embed";

  const GAMES = [
    { name: "Hollow Knight - webport", icon: "icons/hollow-knight.webp", url: "https://293701987.github.io/test/" },
    { name: "Slime Rancher - webport", icon: "icons/slime-rancher.webp", url: "https://293701987.github.io/slimerancher/" },
  ];

  const grid = document.getElementById("grid");
  const empty = document.getElementById("empty");
  const player = document.getElementById("player");
  const frame = document.getElementById("frame");

  /* Opens a blank tab and loads the page inside it */
  function openBlank(url, title) {
    const w = window.open("about:blank", "_blank");
    if (!w) { alert("Your browser blocked the pop-up. Allow pop-ups for this site and try again."); return; }
    w.document.title = title;
    w.document.body.style.cssText = "margin:0;height:100vh;overflow:hidden;background:#000";
    const f = w.document.createElement("iframe");
    f.src = url;
    f.style.cssText = "border:0;width:100%;height:100%";
    f.allow = "fullscreen; autoplay; gamepad; clipboard-write";
    f.setAttribute("allowfullscreen", "");
    w.document.body.appendChild(f);
  }
  let currentGame = null;
  document.getElementById("blankSite").onclick = () => openBlank(location.href, "Games");
  document.getElementById("blankGame").onclick = () => currentGame && openBlank(currentGame.url, currentGame.name);

  function openGame(g) {
    currentGame = g;
    if (OPEN_MODE === "tab") { window.open(g.url, "_blank", "noopener"); return; }
    document.getElementById("ptitle").textContent = g.name;
    document.getElementById("newtab").href = g.url;
    frame.src = g.url;
    player.classList.add("open");
    document.title = g.name;
  }
  function closeGame() {
    player.classList.remove("open");
    frame.src = "about:blank";
    document.title = "Games";
  }
  document.getElementById("back").onclick = closeGame;
  document.addEventListener("keydown", e => { if (e.key === "Escape" && player.classList.contains("open")) closeGame(); });

  function render(list) {
    grid.innerHTML = "";
    empty.hidden = list.length > 0;
    list.forEach(g => {
      const card = document.createElement("button");
      card.className = "game";
      card.addEventListener("click", () => openGame(g));

      const icon = document.createElement("div");
      icon.className = "icon";
      const img = new Image();
      img.alt = g.name;
      img.onerror = () => { icon.textContent = g.name.charAt(0).toUpperCase(); };
      img.src = g.icon;
      icon.appendChild(img);

      const name = document.createElement("div");
      name.className = "name";
      name.textContent = g.name;

      card.append(icon, name);
      grid.appendChild(card);
    });
  }

  document.getElementById("search").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    render(GAMES.filter(g => g.name.toLowerCase().includes(q)));
  });

  render(GAMES);
</script>
</body>
</html>
