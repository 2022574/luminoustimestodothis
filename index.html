<!DOCTYPE html>
<html lang="en">
<head>
<!-- build: kelpforest-v2 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obscura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #f3f0e9;
  --muted: #aaa49a;
  --line: rgba(220,215,200,.28);
  --serif: "IM Fell English", "Palatino Linotype", Georgia, serif;
  --bg: #030302;
  --panel: rgba(5,5,4,.92);
  --panel2: rgba(8,7,6,.85);
  --g1: #aaa49a;
  --g3: #c8c1b5;
  --rule: rgba(235,230,215,.9);
  --hover: rgba(255,255,255,.13);
  --blank-bg: linear-gradient(180deg, rgba(0,0,0,.16), transparent 48%), #e9e6df;
  --blank-fg: #000;
  --blank-border: rgba(0,0,0,.65);
  --btn-bg: linear-gradient(180deg, rgba(255,255,255,.12), transparent 48%), #080706;
  --btn-edge: inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(255,255,255,.04);
  color-scheme: dark;
}

/* SUBNAUTICA THEME */
body.sea {
  --ink: #e8fff4;
  --muted: #8fcdb6;
  --line: rgba(150,255,210,.30);
  --bg: #02130e;
  --panel: rgba(2,24,19,.80);
  --panel2: rgba(3,30,24,.78);
  --g1: #6fd4b0;
  --g3: #a8f2d6;
  --rule: rgba(170,255,222,.9);
  --hover: rgba(150,255,210,.16);
  --blank-bg: linear-gradient(180deg, rgba(0,60,40,.14), transparent 48%), #c4f6e0;
  --blank-fg: #01261c;
  --blank-border: rgba(0,50,35,.7);
  --btn-bg: linear-gradient(180deg, rgba(150,255,210,.14), transparent 48%), #04221b;
  --btn-edge: inset 0 1px 0 rgba(170,255,225,.3), inset 0 0 0 1px rgba(170,255,225,.05);
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.05rem;
  text-shadow: 0 1px 3px rgba(0,0,0,.8);
}
#bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  display: block;
  pointer-events: none;
}

/* HOME */
#home {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
}
#home h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(3.5rem, 9vw, 6.5rem);
  font-weight: 700;
  letter-spacing: -.045em;
  background: linear-gradient(180deg, var(--g1) 0%, #ffffff 55%, var(--g3) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  text-shadow: none;
}
.home-divider {
  width: min(340px, 65vw);
  height: 2px;
  margin: 15px 0;
  background: linear-gradient(90deg, transparent, var(--rule), transparent);
}
.home-white-line {
  width: 75px;
  height: 2px;
  margin: 3px 0 22px;
  background: rgba(255,255,255,.8);
  box-shadow: 0 0 12px rgba(255,255,255,.25);
}
.home-games {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 7px 17px;
  font-family: var(--serif);
  font-size: .95rem;
  letter-spacing: .04em;
  color: var(--ink);
  background: linear-gradient(180deg, rgba(255,255,255,.12), transparent), var(--panel2);
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: var(--btn-edge), 0 4px 14px rgba(0,0,0,.5);
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.home-games:hover {
  background: var(--hover);
  border-color: rgba(255,255,255,.75);
}
.home-games .controller { font-size: 1rem; }

/* LEFT SIDEBAR */
#edge-trigger { display: none; }
#sidebar {
  position: fixed;
  z-index: 31;
  top: 16px;
  left: 16px;
  width: 145px;
  height: auto;
  padding: 10px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.09), transparent 50%),
    var(--panel);
  border: 1px solid var(--line);
  border-radius: 5px;
  box-shadow: 5px 5px 25px rgba(0,0,0,.65);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sidebar-brand {
  font-size: 1.2rem;
  text-align: center;
  margin: 0 0 5px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--g1), #fff);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.side-link {
  width: 100%;
  padding: 8px 10px;
  text-align: left;
  font-family: var(--serif);
  font-size: .95rem;
  color: var(--ink);
  background: rgba(255,255,255,.035);
  border: 1px solid transparent;
  border-radius: 4px;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease;
}
.side-link:hover,
.side-link.active {
  background: rgba(255,255,255,.12);
  border-color: var(--line);
}
.side-link.active { box-shadow: inset 2px 0 0 rgba(255,255,255,.8); }
.side-sep {
  height: 1px;
  margin: 4px 0 2px;
  background: var(--line);
}
.theme-btn {
  font-size: .82rem;
  line-height: 1.2;
}
.theme-btn small {
  display: block;
  color: var(--muted);
  font-size: .72rem;
  letter-spacing: .06em;
  text-transform: uppercase;
}

/* GAMES SECTION */
#games-page { display: none; min-height: 100vh; }
#games-page.active { display: block; }
header {
  padding: 32px 24px 12px;
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  background: linear-gradient(180deg, rgba(255,255,255,.025), transparent);
}
h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: 700;
  font-size: 2.5rem;
  letter-spacing: -.025em;
  position: relative;
  padding-bottom: 14px;
}
h1::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: calc(50% - 50vw);
  width: 100vw;
  height: 2px;
  background: linear-gradient(90deg, var(--rule), rgba(255,255,255,0));
}
.version {
  position: absolute;
  top: 40px;
  right: 24px;
  font-size: 1.1rem;
  font-style: italic;
  color: var(--ink);
}
.tools {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.search {
  width: 100%;
  max-width: 340px;
  padding: 10px 14px;
  font: inherit;
  color: var(--ink);
  background: var(--btn-bg);
  box-shadow: var(--btn-edge);
  border: 1px solid var(--line);
  border-radius: 4px;
  transition: border-color .18s ease;
}
.search::placeholder { color: var(--muted); }
.search:focus { outline: none; border-color: #fff; }
.btn {
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px 13px;
  font-family: var(--serif);
  font-size: .95rem;
  background: linear-gradient(180deg, var(--g1) 0%, #ffffff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  cursor: pointer;
  text-decoration: none;
  box-shadow: var(--btn-edge), 0 2px 8px rgba(0,0,0,.5);
  transition: border-color .18s ease, box-shadow .18s ease;
  display: inline-block;
}
.btn:hover,
.btn:focus-visible {
  border-color: rgba(255,255,255,.75);
  box-shadow: var(--btn-edge), 0 4px 12px rgba(0,0,0,.7);
  outline: none;
}
.btn.blank {
  background: var(--blank-bg);
  color: var(--blank-fg);
  border-color: var(--blank-border);
  -webkit-background-clip: border-box;
  background-clip: border-box;
  -webkit-text-fill-color: var(--blank-fg);
  box-shadow: inset 0 1px 0 rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.5);
}
.row-title {
  max-width: 1200px;
  margin: 22px auto 0;
  padding: 0 24px;
  font-size: 1.3rem;
  font-style: italic;
}
.row-title::after {
  content: "";
  display: block;
  margin-top: 10px;
  height: 2px;
  width: 100%;
  background: linear-gradient(90deg, var(--rule), transparent 50%);
}
.grid {
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 24px 56px;
  display: grid;
  gap: 22px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.game {
  all: unset;
  cursor: pointer;
  display: block;
  position: relative;
  padding: 8px;
  border-radius: 6px;
  transition: transform .18s ease;
}
.game:hover,
.game:focus-visible { transform: scale(1.05); z-index: 2; }
.game:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.icon {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 4px;
  background: var(--btn-bg);
  border: 1px solid var(--line);
  box-shadow: var(--btn-edge), 0 8px 22px rgba(0,0,0,.7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  color: var(--muted);
}
.icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.name {
  margin-top: 10px;
  font-size: 1rem;
  line-height: 1.25;
  text-align: center;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.empty {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  color: var(--muted);
}

/* GAME PLAYER */
#player {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  flex-direction: column;
  z-index: 40;
}
#player.open { display: flex; }
.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 15px;
  min-height: 58px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.09), transparent),
    var(--bg);
  border-bottom: 1px solid var(--line);
}
.bar .title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 1.15rem;
}
.bar .btn { padding: 8px 13px; font-size: .95rem; }
#frame { flex: 1; width: 100%; border: 0; background: #000; }

/* FULLSCREEN TOP BAR */
#hot {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 14px;
  z-index: 5;
}
#player.fs #hot { display: block; }
#player.fs .bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 6;
  transform: translateY(-110%);
  transition: transform .22s ease;
}
#player.fs.show .bar { transform: translateY(0); }
#player.fs.show #hot { display: none; }

/* GRADIENT TEXT */
h1, .version, .row-title, .name, .bar .title, .empty {
  background-image: linear-gradient(180deg, var(--g1) 0%, #ffffff 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

@media (max-width: 600px) {
  .version { position: static; margin-top: 8px; }
  header { padding-top: 22px; }
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
    gap: 12px;
  }
  #sidebar { width: 125px; top: 10px; left: 10px; }
  .bar { flex-wrap: wrap; }
  .bar .title { min-width: 100%; order: -1; }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .game, .search, #sidebar { transition: none; }
}

/* SUBNAUTICA BACKGROUND: the photo itself, embedded in this file, nothing drawn on top */
#sea-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  display: none;
  pointer-events: none;
  background-color: #02130e;
  background-image: url("backgrounds/kelpforest.webp");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
body.sea #sea-bg { display: block; }
</style>
</head>
<body>

<div id="sea-bg" aria-hidden="true"></div>
<canvas id="bg" aria-hidden="true"></canvas>

<nav id="sidebar" aria-label="Main navigation">
  <div class="sidebar-brand">Obscura</div>
  <button class="side-link active" id="home-tab">Home</button>
  <button class="side-link" id="games-tab">Games</button>
  <div class="side-sep"></div>
  <button class="side-link theme-btn" id="theme-tab" title="Switch theme">
    <small>Theme</small>
    <span id="theme-name">Obscura</span>
  </button>
</nav>

<!-- HOME -->
<section id="home">
  <h1>Obscura</h1>
  <div class="home-divider"></div>
  <div class="home-white-line"></div>
  <button class="home-games" id="home-games">
    <span class="controller">🎮</span>
    <span>Games</span>
  </button>
</section>

<!-- GAMES -->
<section id="games-page">
  <header>
    <h1>Games</h1>
    <div class="version">Version 1.7.35</div>
    <div class="tools">
      <input class="search" id="search" type="search" placeholder="Search games" aria-label="Search games">
      <button class="btn blank" id="blankSite">Open site in about:blank</button>
    </div>
  </header>
  <div class="row-title">All games</div>
  <main class="grid" id="grid"></main>
  <p class="empty" id="empty" hidden>No games match your search.</p>
</section>

<!-- GAME PLAYER -->
<div id="player" role="dialog" aria-modal="true">
  <div class="bar">
    <button class="btn alt" id="back">Back</button>
    <span class="title" id="ptitle"></span>
    <button class="btn alt" id="fs">Fullscreen</button>
    <button class="btn blank" id="blankGame">Open in about:blank</button>
    <a class="btn" id="newtab" target="_blank" rel="noopener">Open in new tab</a>
  </div>
  <div id="hot"></div>
  <iframe id="frame" allow="fullscreen; autoplay; gamepad; clipboard-write" allowfullscreen></iframe>
</div>

<script>
const OPEN_MODE = "embed";

const GAMES = [
  { name: "Hollow Knight - webport", icon: "icons/hollow-knight.webp", url: "https://293701987.github.io/test/" },
  { name: "Slime Rancher - webport", icon: "icons/slime-rancher.webp", url: "https://293701987.github.io/slimerancher/" },
  { name: "Cat Goes Fishing - webport", icon: "icons/cat-goes-fishing.webp", url: "https://293701987.github.io/cat-goes-fishing-web-port/" },
  { name: "How To Fish - webport", icon: "icons/how-to-fish.png", url: "https://293701987.github.io/wasm.rip/files/HowToFish/HowToFish.html" },
  { name: "Cluster Truck - webport", icon: "icons/cluster-truck.png", url: "https://293701987.github.io/wasm.rip/files/ClusterTruck/clustertruck.html" },
  { name: "Brotato - webport", icon: "icons/brotato.webp", url: "https://293701987.github.io/BrotatoWeb/" },
  { name: "Stardew Valley - webport", icon: "icons/stardew-valley.webp", url: "https://293701987.github.io/broworkthistimepls/" },
  { name: "Cuphead - webport", icon: "icons/cuphead.png", url: "https://293701987.github.io/CupheadWeb/" },
  { name: "60 Seconds - webport", icon: "icons/60-seconds-reatomized.png", url: "https://293701987.github.io/60-Seconds-Webport/" },
  { name: "Ultrakill - webport", icon: "icons/UK.webp", url: "https://293701987.github.io/ultrakillworknowpls/" },
  { name: "Toby Web", icon: "icons/Undertale-logo.jpg", url: "https://2022574.github.io/broworkman//" },
  { name: "deeeeer simulator - webport", icon: "icons/DS.jpeg", url: "https://293701987.github.io/deeertest/" },
  { name: "The Binding of Isaac - webport", icon: "icons/TBI.webp", url: "https://293701987.github.io/the-browsing-of-isaac/" },
  { name: "Bendy and the Ink Machine - webport", icon: "icons/BTIM.webp", url: "https://293701987.github.io/BATIMFullPort/" },
  { name: "Geometry Dash - webport", icon: "icons/gd.webp", url: "https://293701987.github.io/geodashplsworkineedthis-testing/" },
  { name: "Shift at Midnight - webport", icon: "icons/ShiftatMidnight.jpeg", url: "https://293701987.github.io/ShiftAtMidnightPort/" },
  { name: "Granny - webport", icon: "icons/granny.jpeg", url: "https://293701987.github.io/GrannyWeb/" },
  { name: "Fear & Hunger - webport", icon: "icons/fear-and-hunger.jpeg", url: "https://293701987.github.io/fear-and-hunger/" },
  { name: "FNAF 1 - webport", icon: "icons/FNAF-1.jpeg", url: "https://293701987.github.io/FNAF1/" },
  { name: "FNAF 2 - webport", icon: "icons/FNAF-2.jpeg", url: "https://2022574.github.io/fanf-2/" },
  { name: "FNAF 3 - webport", icon: "icons/FNAF-3.jpeg", url: "https://2022574.github.io/fanf-3/" },
  { name: "FNAF 4 - webport", icon: "icons/FNAF-4.jpeg", url: "https://2022574.github.io/fanf-4/" },
  { name: "FNAF UCN", icon: "icons/FNAF-UCN.jpeg", url: "https://293701987.github.io/fanf-UCN/" },
  { name: "Backrooms - webport", icon: "icons/backrooms.jpeg", url: "https://2022574.github.io/backroomsgame/" },
  { name: "Eaglercraft 1.12", icon: "icons/eaglercraft.jpeg", url: "https://2022574.github.io/1-12-WASM/" },
  { name: "Angry Birds - webport", icon: "icons/angrybirds.jpeg", url: "https://2022574.github.io/angybards/" },
  { name: "Crossy Road - webport", icon: "icons/crossyroad.png", url: "https://2022574.github.io/crossyroad/" },
  { name: "Plants VS Zombies - webport", icon: "icons/pvz.jpeg", url: "https://2022574.github.io/pvz/" },
  { name: "The Impossible Quiz - webport", icon: "icons/impossiblequiz.jpeg", url: "https://2022574.github.io/impoquiz/" },
  { name: "Friday Night Funkin - webport", icon: "icons/fnf.png", url: "https://2022574.github.io/FNF/" },
  { name: "Schoolboy Runaway - webport", icon: "icons/runaway.jpeg", url: "https://2022574.github.io/runaway/" },
  { name: "Pokemon Emerald - webport", icon: "icons/pokemonemerald.jpeg", url: "https://2022574.github.io/pokemonemerald/" },
  { name: "Getaway Shootout", icon: "icons/getawayshootout.png", url: "https://2022574.github.io/getawayshoot/" },
  { name: "Crazy Cattle 3d", icon: "icons/cattle3d.jpeg", url: "https://2022574.github.io/cattle/" },
  { name: "Getting Over It - webport", icon: "icons/gettingoverit.jpeg", url: "https://2022574.github.io/getoverit/" },
  { name: "PEAK - webport", icon: "icons/peakthegame.jpeg", url: "https://2022574.github.io/peak/?cdn=https%3A%2F%2Fcdn.jsdelivr.net%2Fgh%2Fwasmdotrip%2FPeak-Port%40main" },
  { name: "Feed Grow Fish - webport", icon: "icons/feedgrowfish.jpeg", url: "https://293701987.github.io/feedgrowfishsopeak/" },
  { name: "Forager - webport", icon: "icons/forager.jpeg", url: "https://6s4bpxwk47dwm0cx.05k.lambda-web.us-east-2.on.aws/" },
  { name: "DDLC - webport", icon: "icons/ddlc.jpeg", url: "https://2022574.github.io/ddlc-web/" }
];

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const player = document.getElementById("player");
const frame = document.getElementById("frame");
const home = document.getElementById("home");
const gamesPage = document.getElementById("games-page");
const sidebar = document.getElementById("sidebar");
const homeTab = document.getElementById("home-tab");
const gamesTab = document.getElementById("games-tab");

let currentGame = null;

/* NAVIGATION */
function showPage(page) {
  closeGame(false);
  const onHome = page === "home";
  home.style.display = onHome ? "flex" : "none";
  gamesPage.classList.toggle("active", !onHome);
  homeTab.classList.toggle("active", onHome);
  gamesTab.classList.toggle("active", !onHome);
  document.title = onHome ? "Obscura" : "Games (v1.7.35)";
}
homeTab.addEventListener("click", () => showPage("home"));
gamesTab.addEventListener("click", () => showPage("games"));
document.getElementById("home-games").addEventListener("click", () => showPage("games"));

/* ABOUT:BLANK */
function openBlank(url, title) {
  const w = window.open("about:blank", "_blank");
  if (!w) {
    alert("Your browser blocked the pop-up. Allow pop-ups for this site and try again.");
    return;
  }
  w.document.title = title;
  w.document.body.style.cssText = "margin:0;height:100vh;overflow:hidden;background:#000";
  const f = w.document.createElement("iframe");
  f.src = url;
  f.style.cssText = "border:0;width:100%;height:100%";
  f.allow = "fullscreen; autoplay; gamepad; clipboard-write";
  f.setAttribute("allowfullscreen", "");
  w.document.body.appendChild(f);
}
document.getElementById("blankSite").onclick = () => openBlank(location.href, "Obscura");
document.getElementById("blankGame").onclick = () => {
  if (currentGame) openBlank(currentGame.url, currentGame.name);
};

/* GAME PLAYER */
function openGame(g) {
  currentGame = g;
  // Forager does not allow embedding, so open it directly.
  if (g.name.toLowerCase().includes("forager")) {
    window.location.href = g.url;
    return;
  }
  if (OPEN_MODE === "tab") {
    window.open(g.url, "_blank", "noopener");
    return;
  }
  document.getElementById("ptitle").textContent = g.name;
  document.getElementById("newtab").href = g.url;
  frame.src = g.url;
  player.classList.add("open");
  document.title = g.name;
}
function closeGame(returnToPage = true) {
  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
  player.classList.remove("open");
  player.classList.remove("fs", "show");
  frame.src = "about:blank";
  currentGame = null;
  if (returnToPage) {
    document.title = gamesPage.classList.contains("active")
      ? "Games (v1.7.35)"
      : "Obscura";
  }
}
document.getElementById("back").onclick = () => closeGame();
document.addEventListener("keydown", e => {
  if (e.key === "Escape" &&
      player.classList.contains("open") &&
      !document.fullscreenElement) {
    closeGame();
  }
});

/* GAME GRID */
function render(list) {
  grid.innerHTML = "";
  empty.hidden = list.length > 0;
  list.forEach(g => {
    const card = document.createElement("button");
    card.className = "game";
    card.addEventListener("click", () => openGame(g));
    const icon = document.createElement("div");
    icon.className = "icon";
    const img = new Image();
    img.alt = g.name;
    img.loading = "lazy";
    img.decoding = "async";
    img.onerror = () => {
      img.remove();
      icon.textContent = g.name.charAt(0).toUpperCase();
    };
    img.src = g.icon;
    icon.appendChild(img);
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = g.name;
    card.append(icon, name);
    grid.appendChild(card);
  });
}
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  render(GAMES.filter(g => g.name.toLowerCase().includes(q)));
});
render(GAMES);

/* FULLSCREEN TOP BAR */
const fsBtn = document.getElementById("fs");
const hot = document.getElementById("hot");
let hideTimer = null;
fsBtn.onclick = () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (player.requestFullscreen) {
    player.requestFullscreen().catch(() => {
      alert("Fullscreen is blocked here. Try Open in new tab and use fullscreen from the game page.");
    });
  } else {
    alert("This browser does not support fullscreen.");
  }
};
document.addEventListener("fullscreenchange", () => {
  const on = document.fullscreenElement === player;
  player.classList.toggle("fs", on);
  player.classList.remove("show");
  fsBtn.textContent = on ? "Exit fullscreen" : "Fullscreen";
  if (navigator.keyboard && navigator.keyboard.lock) {
    if (on) navigator.keyboard.lock(["Escape"]).catch(() => {});
    else navigator.keyboard.unlock();
  }
});
function showBar() { clearTimeout(hideTimer); player.classList.add("show"); }
function hideBar() { player.classList.remove("show"); }
hot.addEventListener("mouseenter", showBar);
hot.addEventListener("click", () => {
  showBar();
  hideTimer = setTimeout(hideBar, 3500);
});
document.querySelector(".bar").addEventListener("mouseleave", hideBar);

/* BACKGROUND + THEMES
   "ink"  = the original ink-wash strands
   "sea"  = Subnautica theme: kelp-forest photo whose kelp sways
            like real kelp (anchored at the bottom, swinging more toward
            the tips), plus light rays, drifting particles and dark
            foreground kelp.
   Put your photo at  backgrounds/subnautica.jpg
*/
(function () {
  const cv = document.getElementById("bg");
  const ctx = cv.getContext("2d", { alpha: false });
  const themeBtn = document.getElementById("theme-tab");
  const themeName = document.getElementById("theme-name");
  const SEA_IMAGE = "backgrounds/subnautica.jpg";
  const THEMES = { ink: "Obscura", sea: "Subnautica" };
  const FPS = { ink: 16, sea: 30 };

  let theme = "ink";
  try {
    const saved = localStorage.getItem("obscura-theme");
    if (saved === "sea" || saved === "ink") theme = saved;
  } catch (e) {}

  let W = 0, H = 0;
  let lastFrame = 0;
  let animationId = null;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- INK ---------- */
  const bundles = [];
  for (let b = 0; b < 3; b++) {
    bundles.push({
      y: (b + .5) / 3,
      amp: 45 + Math.random() * 65,
      f: .002 + Math.random() * .002,
      sp: .2 + Math.random() * .2,
      ph: Math.random() * 6.28,
      tilt: (Math.random() - .5) * .15,
      gap: 9 + Math.random() * 5,
      n: 4
    });
  }

  function drawInk(t) {
    ctx.fillStyle = "#030302";
    ctx.fillRect(0, 0, W, H);
    const clouds = [
      [W * .2, H * .25, Math.max(W, H) * .65],
      [W * .8, H * .7, Math.max(W, H) * .55],
      [W * .5, H * .5, Math.max(W, H) * .8]
    ];
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      const g = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], c[2]);
      g.addColorStop(0, "rgba(120,115,105,.055)");
      g.addColorStop(.5, "rgba(65,60,55,.025)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.lineCap = "round";
    for (const bd of bundles) {
      for (let i = 0; i < bd.n; i++) {
        const k = i - (bd.n - 1) / 2;
        ctx.beginPath();
        for (let x = -20; x <= W + 20; x += 32) {
          const weave = 1 + .6 * Math.sin(x * bd.f * .7 + bd.ph + t * .00015);
          const y = bd.y * H
            + bd.tilt * (x - W / 2)
            + Math.sin(x * bd.f + bd.ph + t * .0005 * bd.sp) * bd.amp
            + Math.sin(x * bd.f * 2 + i * .5 + t * .0007 * bd.sp) * bd.amp * .2
            + k * bd.gap * weave;
          if (x === -20) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        const edge = 1 - Math.abs(k) / (bd.n / 2);
        ctx.strokeStyle = "rgba(220,215,200," + (.035 + edge * .13) + ")";
        ctx.lineWidth = .7 + edge * 1.2;
        ctx.stroke();
      }
    }
  }

  /* ---------- SUBNAUTICA (kelp forest) ---------- */
  const bgImg = new Image();
  let imgOk = false;
  bgImg.onload = () => { imgOk = true; updateCanvasVisibility(); if (theme === "sea") drawSea(performance.now()); };
  bgImg.src = "backgrounds/kelpforest.webp";
  

  // Foreground kelp stalks (x and height are fractions of the screen)
  const stalks = [
    { x: .02, h: .92, w: 9,  ph: 0.4, dark: 1 },
    { x: .07, h: .70, w: 6,  ph: 2.1, dark: 1 },
    { x: .12, h: .48, w: 5,  ph: 4.0, dark: 1 },
    { x: .88, h: .52, w: 5,  ph: 1.3, dark: 1 },
    { x: .94, h: .78, w: 7,  ph: 3.2, dark: 1 },
    { x: .985, h: .95, w: 10, ph: 5.1, dark: 1 },
    // used only if the photo is missing so the scene is not empty
    { x: .26, h: .78, w: 5,  ph: 1.0, dark: 0 },
    { x: .38, h: .62, w: 4,  ph: 2.7, dark: 0 },
    { x: .52, h: .90, w: 6,  ph: 0.2, dark: 0 },
    { x: .66, h: .70, w: 5,  ph: 3.9, dark: 0 },
    { x: .78, h: .58, w: 4,  ph: 5.5, dark: 0 }
  ];

  const motes = [];
  for (let i = 0; i < 70; i++) {
    motes.push({
      x: Math.random(), y: Math.random(),
      r: .6 + Math.random() * 1.8,
      v: .004 + Math.random() * .012,
      ph: Math.random() * 6.28,
      a: .15 + Math.random() * .35
    });
  }
  let lastT = 0;

  function drawKelp(s, t) {
    const baseX = s.x * W;
    const top = H - s.h * H;
    const len = H - top;
    const SEG = 16;
    const pts = [];
    for (let i = 0; i <= SEG; i++) {
      const f = i / SEG;               // 0 at the holdfast, 1 at the tip
      const y = H + 6 - f * (len + 6);
      const sway = Math.pow(f, 1.5) * (22 + s.w * 2.2);
      const x = baseX
        + Math.sin(f * 3.2 - t * .0013 + s.ph) * sway
        + Math.sin(f * 6.1 - t * .0021 + s.ph * 1.7) * sway * .22
        + Math.sin(t * .0005 + s.ph) * 14 * f;       // slow swell / surge
      pts.push([x, y, f]);
    }
    const col = s.dark ? "3,22,16" : "20,120,80";
    const alpha = s.dark ? .88 : .55;
    ctx.lineCap = "round";
    // stipe
    for (let i = 0; i < SEG; i++) {
      const a = pts[i], b = pts[i + 1];
      ctx.strokeStyle = "rgba(" + col + "," + alpha + ")";
      ctx.lineWidth = Math.max(1.2, s.w * (1 - a[2] * .75));
      ctx.beginPath();
      ctx.moveTo(a[0], a[1]);
      ctx.lineTo(b[0], b[1]);
      ctx.stroke();
    }
    // blades (leaves) that trail with the water, a little lazier than the stipe
    ctx.fillStyle = "rgba(" + col + "," + (alpha * .9) + ")";
    for (let i = 2; i < SEG; i++) {
      const p = pts[i];
      const side = i % 2 ? 1 : -1;
      const L = (16 + s.w * 3.2) * (1 - p[2] * .55);
      const flap = Math.sin(t * .0022 + i * 1.3 + s.ph) * .35;
      const ang = -1.0 * side + flap - Math.sin(p[2] * 3 - t * .0013 + s.ph) * .15;
      const ex = p[0] + Math.sin(ang) * L * side * -1;
      const ey = p[1] - Math.cos(ang) * L * .55;
      const mx = (p[0] + ex) / 2 + side * 5;
      const my = (p[1] + ey) / 2;
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]);
      ctx.quadraticCurveTo(mx, my - 3, ex, ey);
      ctx.quadraticCurveTo(mx, my + 5, p[0], p[1] + 3);
      ctx.fill();
    }
  }

  function drawSea(t) {
    if (!imgOk) return;
    const iw = bgImg.naturalWidth, ih = bgImg.naturalHeight;
    const A = W / 1920;                 // sway scales with screen width
    const maxShift = 11 * A;
    let sc = Math.max(W / iw, H / ih);  // same "cover" fit as the CSS background
    if (iw * sc < W + 2 * maxShift) sc = (W + 2 * maxShift) / iw; // just enough extra width to hide the moving edges
    const dw = iw * sc, dh = ih * sc;
    const ox = (W - dw) / 2, oy = (H - dh) / 2;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    const step = 3;
    /* The photo is drawn in thin horizontal strips. Each strip is nudged
       sideways by slow travelling waves that grow toward the top and fade to
       zero at the bottom, so the kelp stays rooted and bends like in a current.
       Nothing is added to the picture. */
    for (let y = 0; y < H; y += step) {
      const k = Math.pow(1 - y / H, 1.3);
      const shift = k * A * (
          5   * Math.sin(y * .0075 - t * .0011)
        + 2.2 * Math.sin(y * .016  - t * .0018 + 1.7)
        + 3   * Math.sin(t * .0006)
      );
      const sy = (y - oy) / sc;
      const sh = Math.min((step + 1) / sc, ih - sy);
      if (sh <= 0) break;
      ctx.drawImage(bgImg, 0, sy, iw, sh, ox + shift, y, dw, sh * sc);
    }
  }

  /* ---------- LOOP + THEME SWITCH ---------- */
  function draw(t) {
    if (theme === "sea") { drawSea(t); return; }
    drawInk(t);
  }

  function updateCanvasVisibility() {
    // Sea theme: the CSS background already shows the exact photo. The canvas
    // only takes over (with the sway) once the photo has loaded.
    const show = theme === "sea" ? (imgOk && !reducedMotion) : true;
    cv.style.display = show ? "block" : "none";
  }

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, theme === "sea" ? 2 : 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(performance.now());
  }

  function loop(t) {
    animationId = null;
    if (document.hidden || reducedMotion) return;
    if (t - lastFrame >= 1000 / FPS[theme]) {
      lastFrame = t;
      draw(t);
    }
    animationId = requestAnimationFrame(loop);
  }
  function startAnimation() {
    if (reducedMotion || document.hidden || animationId !== null) return;
    animationId = requestAnimationFrame(loop);
  }
  function stopAnimation() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
  }

  function applyTheme() {
    document.body.classList.toggle("sea", theme === "sea");
    updateCanvasVisibility();
    // the button shows the theme you will switch to
    themeName.textContent = theme === "sea" ? THEMES.ink : THEMES.sea;
    themeBtn.title = "Switch to the " + themeName.textContent + " theme";
    size();
  }

  themeBtn.addEventListener("click", () => {
    theme = theme === "sea" ? "ink" : "sea";
    try { localStorage.setItem("obscura-theme", theme); } catch (e) {}
    applyTheme();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopAnimation();
    else startAnimation();
  });
  window.addEventListener("resize", size);

  size();
  applyTheme();
  startAnimation();
})();
</script>
</body>
</html>
