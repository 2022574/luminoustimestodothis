<style>
:root {
  --ink: #f3f0e9;
  --muted: #aaa49a;
  --line: rgba(220,215,200,.28);
  --serif: "IM Fell English", "Palatino Linotype", Georgia, serif;
  --bg: #030302;
  --panel: rgba(5,5,4,.92);
  --panel2: rgba(8,7,6,.85);
  --g1: #aaa49a;
  --g3: #c8c1b5;
  --g2: #ffffff;
  --hi: #ffffff;
  --tint: rgba(255,255,255,.035);
  --h1-track: -.045em;
  --h1-weight: 700;
  --base-size: 1.05rem;
  --rule: rgba(235,230,215,.9);
  --hover: rgba(255,255,255,.13);
  --blank-bg: linear-gradient(180deg, rgba(0,0,0,.16), transparent 48%), #e9e6df;
  --blank-fg: #000;
  --blank-border: rgba(0,0,0,.65);
  --btn-bg: linear-gradient(180deg, rgba(255,255,255,.12), transparent 48%), #080706;
  --btn-edge: inset 0 1px 0 rgba(255,255,255,.25), inset 0 0 0 1px rgba(255,255,255,.04);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  overflow-x: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--serif);
  font-size: var(--base-size);
  text-shadow: 0 1px 3px rgba(0,0,0,.8);
}
#bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  display: block;
  pointer-events: none;
}

/* HOME */
#home {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 30px;
}
#home h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(3.5rem, 9vw, 6.5rem);
  font-weight: var(--h1-weight);
  letter-spacing: var(--h1-track);
  background: linear-gradient(180deg, var(--g1) 0%, var(--g2) 55%, var(--g3) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  text-shadow: none;
}
.home-divider {
  width: min(340px, 65vw);
  height: 2px;
  margin: 15px 0;
  background: linear-gradient(90deg, transparent, var(--rule), transparent);
}
.home-white-line {
  width: 75px;
  height: 2px;
  margin: 3px 0 22px;
  background: var(--hi);
  opacity: .85;
  box-shadow: 0 0 12px var(--line);
}
.home-games {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 7px 17px;
  font-family: var(--serif);
  font-size: .95rem;
  letter-spacing: .04em;
  color: var(--ink);
  background: linear-gradient(180deg, rgba(255,255,255,.12), transparent), var(--panel2);
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: var(--btn-edge), 0 4px 14px rgba(0,0,0,.5);
  cursor: pointer;
  transition: background .2s, border-color .2s;
}
.home-games:hover {
  background: var(--hover);
  border-color: var(--hi);
}
.home-games .controller { font-size: 1rem; }
.home-buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

/* LEFT SIDEBAR */
#edge-trigger { display: none; }
#sidebar {
  position: fixed;
  z-index: 31;
  top: 16px;
  left: 16px;
  width: 145px;
  height: auto;
  padding: 10px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.09), transparent 50%),
    var(--panel);
  border: 1px solid var(--line);
  border-radius: 5px;
  box-shadow: 5px 5px 25px rgba(0,0,0,.65);
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.sidebar-brand {
  font-size: 1.2rem;
  text-align: center;
  margin: 0 0 5px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, var(--g1), var(--g2));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}
.side-link {
  width: 100%;
  padding: 8px 10px;
  text-align: left;
  font-family: var(--serif);
  font-size: .95rem;
  color: var(--ink);
  background: var(--tint);
  border: 1px solid transparent;
  border-radius: 4px;
  cursor: pointer;
  transition: background .18s ease, border-color .18s ease;
}
.side-link:hover,
.side-link.active {
  background: var(--hover);
  border-color: var(--line);
}
.side-link.active { box-shadow: inset 2px 0 0 var(--hi); }
.side-sep {
  height: 1px;
  margin: 4px 0 2px;
  background: var(--line);
}
.theme-btn {
  font-size: .82rem;
  line-height: 1.2;
}
.theme-btn small {
  display: block;
  color: var(--muted);
  font-size: .72rem;
  letter-spacing: .06em;
  text-transform: uppercase;
}

/* GAMES SECTION */
#games-page, #settings-page { display: none; min-height: 100vh; }
#games-page.active, #settings-page.active { display: block; }
header {
  padding: 32px 24px 12px;
  max-width: 1200px;
  margin: 0 auto;
  position: relative;
  background: linear-gradient(180deg, rgba(255,255,255,.025), transparent);
}
h1 {
  margin: 0;
  font-family: var(--serif);
  font-weight: var(--h1-weight);
  font-size: 2.5rem;
  letter-spacing: -.025em;
  position: relative;
  padding-bottom: 14px;
}
h1::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: calc(50% - 50vw);
  width: 100vw;
  height: 2px;
  background: linear-gradient(90deg, var(--rule), rgba(255,255,255,0));
}
.version {
  position: absolute;
  top: 40px;
  right: 24px;
  font-size: 1.1rem;
  font-style: italic;
  color: var(--ink);
}
.tools {
  margin-top: 18px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
}
.search {
  width: 100%;
  max-width: 340px;
  padding: 10px 14px;
  font: inherit;
  color: var(--ink);
  background: var(--btn-bg);
  box-shadow: var(--btn-edge);
  border: 1px solid var(--line);
  border-radius: 4px;
  transition: border-color .18s ease;
}
.search::placeholder { color: var(--muted); }
.search:focus { outline: none; border-color: var(--hi); }
.btn {
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 8px 13px;
  font-family: var(--serif);
  font-size: .95rem;
  background: linear-gradient(180deg, var(--g1) 0%, var(--g2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  cursor: pointer;
  text-decoration: none;
  box-shadow: var(--btn-edge), 0 2px 8px rgba(0,0,0,.5);
  transition: border-color .18s ease, box-shadow .18s ease;
  display: inline-block;
}
.btn:hover,
.btn:focus-visible {
  border-color: var(--hi);
  box-shadow: var(--btn-edge), 0 4px 12px rgba(0,0,0,.7);
  outline: none;
}
.btn.blank {
  background: var(--blank-bg);
  color: var(--blank-fg);
  border-color: var(--blank-border);
  -webkit-background-clip: border-box;
  background-clip: border-box;
  -webkit-text-fill-color: var(--blank-fg);
  box-shadow: inset 0 1px 0 rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.5);
}
.row-title {
  max-width: 1200px;
  margin: 22px auto 0;
  padding: 0 24px;
  font-size: 1.3rem;
  font-style: italic;
}
.row-title::after {
  content: "";
  display: block;
  margin-top: 10px;
  height: 2px;
  width: 100%;
  background: linear-gradient(90deg, var(--rule), transparent 50%);
}
.grid {
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 24px 56px;
  display: grid;
  gap: 22px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.game {
  all: unset;
  cursor: pointer;
  display: block;
  position: relative;
  padding: 8px;
  border-radius: 6px;
  transition: transform .18s ease;
}
.game:hover,
.game:focus-visible { transform: scale(1.05); z-index: 2; }
.game:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
.icon {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  border-radius: 4px;
  background: var(--btn-bg);
  border: 1px solid var(--line);
  box-shadow: var(--btn-edge), 0 8px 22px rgba(0,0,0,.7);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 3rem;
  color: var(--muted);
}
.icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.name {
  margin-top: 10px;
  font-size: 1rem;
  line-height: 1.25;
  text-align: center;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.empty {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 24px;
  color: var(--muted);
}

/* GAME PLAYER */
#player {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  flex-direction: column;
  z-index: 40;
}
#player.open { display: flex; }
.bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 15px;
  min-height: 58px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.09), transparent),
    var(--bg);
  border-bottom: 1px solid var(--line);
}
.bar .title {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 1.15rem;
}
.bar .btn { padding: 8px 13px; font-size: .95rem; }
#frame { flex: 1; width: 100%; border: 0; background: #000; }

/* FULLSCREEN TOP BAR */
#hot {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 14px;
  z-index: 5;
}
#player.fs #hot { display: block; }
#player.fs .bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  z-index: 6;
  transform: translateY(-110%);
  transition: transform .22s ease;
}
#player.fs.show .bar { transform: translateY(0); }
#player.fs.show #hot { display: none; }

/* GRADIENT TEXT */
h1, .version, .row-title, .name, .bar .title, .empty {
  background-image: linear-gradient(180deg, var(--g1) 0%, var(--g2) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
}

@media (max-width: 600px) {
  .version { position: static; margin-top: 8px; }
  header { padding-top: 22px; }
  .grid {
    grid-template-columns: repeat(auto-fill, minmax(125px, 1fr));
    gap: 12px;
  }
  #sidebar { width: 125px; top: 10px; left: 10px; }
  .bar { flex-wrap: wrap; }
  .bar .title { min-width: 100%; order: -1; }
}
@media (prefers-reduced-motion: reduce) {
  .btn, .game, .search, #sidebar { transition: none; }
}

/* THEME BACKGROUND (colour or picture; the sway canvas sits on top for the kelp theme) */
#theme-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  display: none;
  pointer-events: none;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* DRAGGABLE SIDEBAR */
#sidebar { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
#sidebar.dragging { cursor: grabbing; }
#sidebar.dragging, #sidebar.dragging * { transition: none !important; }

/* SETTINGS / THEME CARDS */
.note { margin-top: 14px; }
.theme-card.active .icon {
  border-color: var(--hi);
  box-shadow: var(--btn-edge), 0 0 0 2px var(--hi), 0 8px 22px rgba(0,0,0,.7);
}
.sw-aa {
  font-size: 2.7rem;
  line-height: 1;
  font-weight: 700;
  padding: 0 4px 10px;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  color: transparent;
  text-shadow: none;
}
.sw-dots {
  position: absolute;
  left: 0; right: 0; bottom: 9px;
  display: flex;
  justify-content: center;
  gap: 5px;
}
.sw-dots i {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,.3);
}
</style>
</head>

  return page === "games" ? "Games (v1.7.35)"
       : page === "settings" ? "Settings (v1.7.35)"
       : "Omniwarp";
}
function showPage(page) {
  closeGame(false);
  currentPage = page;
  home.style.display = page === "home" ? "flex" : "none";
  gamesPage.classList.toggle("active", page === "games");
  settingsPage.classList.toggle("active", page === "settings");
  homeTab.classList.toggle("active", page === "home");
  gamesTab.classList.toggle("active", page === "games");
  settingsTab.classList.toggle("active", page === "settings");
  document.title = titleFor(page);
}
homeTab.addEventListener("click", () => showPage("home"));
gamesTab.addEventListener("click", () => showPage("games"));
settingsTab.addEventListener("click", () => showPage("settings"));
document.getElementById("home-games").addEventListener("click", () => showPage("games"));
document.getElementById("home-settings").addEventListener("click", () => showPage("settings"));

/* ABOUT:BLANK */
function openBlank(url, title) {
  const w = window.open("about:blank", "_blank");
  if (!w) {
    alert("Your browser blocked the pop-up. Allow pop-ups for this site and try again.");
    return;
  }
  w.document.title = title;
  w.document.body.style.cssText = "margin:0;height:100vh;overflow:hidden;background:#000";
  const f = w.document.createElement("iframe");
  f.src = url;
  f.style.cssText = "border:0;width:100%;height:100%";
  f.allow = "fullscreen; autoplay; gamepad; clipboard-write";
  f.setAttribute("allowfullscreen", "");
  w.document.body.appendChild(f);
}
document.getElementById("blankSite").onclick = () => openBlank(location.href, "Omniwarp");
document.getElementById("blankGame").onclick = () => {
  if (currentGame) openBlank(currentGame.url, currentGame.name);
};

/* GAME PLAYER */
function openGame(g) {
  currentGame = g;
  // Forager does not allow embedding, so open it directly.
  if (g.name.toLowerCase().includes("forager")) {
    window.location.href = g.url;
    return;
  }
  if (OPEN_MODE === "tab") {
    window.open(g.url, "_blank", "noopener");
    return;
  }
  document.getElementById("ptitle").textContent = g.name;
  document.getElementById("newtab").href = g.url;
  frame.src = g.url;
  player.classList.add("open");
  document.title = g.name;
}
function closeGame(returnToPage = true) {
  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
  player.classList.remove("open");
  player.classList.remove("fs", "show");
  frame.src = "about:blank";
  currentGame = null;
  if (returnToPage) {
    document.title = titleFor(currentPage);
  }
}
document.getElementById("back").onclick = () => closeGame();
document.addEventListener("keydown", e => {
  if (e.key === "Escape" &&
      player.classList.contains("open") &&
      !document.fullscreenElement) {
    closeGame();
  }
});

/* GAME GRID */
function render(list) {
  grid.innerHTML = "";
  empty.hidden = list.length > 0;
  list.forEach(g => {
    const card = document.createElement("button");
    card.className = "game";
    card.addEventListener("click", () => openGame(g));
    const icon = document.createElement("div");
    icon.className = "icon";
    const img = new Image();
    img.alt = g.name;
    img.loading = "lazy";
    img.decoding = "async";
    img.onerror = () => {
      img.remove();
      icon.textContent = g.name.charAt(0).toUpperCase();
    };
    img.src = g.icon;
    icon.appendChild(img);
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = g.name;
    card.append(icon, name);
    grid.appendChild(card);
  });
}
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  render(GAMES.filter(g => g.name.toLowerCase().includes(q)));
});
render(GAMES);

/* FULLSCREEN TOP BAR */
const fsBtn = document.getElementById("fs");
const hot = document.getElementById("hot");
let hideTimer = null;
fsBtn.onclick = () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (player.requestFullscreen) {
    player.requestFullscreen().catch(() => {
      alert("Fullscreen is blocked here. Try Open in new tab and use fullscreen from the game page.");
    });
  } else {
    alert("This browser does not support fullscreen.");
  }
};
document.addEventListener("fullscreenchange", () => {
  const on = document.fullscreenElement === player;
  player.classList.toggle("fs", on);
  player.classList.remove("show");
  fsBtn.textContent = on ? "Exit fullscreen" : "Fullscreen";
  if (navigator.keyboard && navigator.keyboard.lock) {
    if (on) navigator.keyboard.lock(["Escape"]).catch(() => {});
    else navigator.keyboard.unlock();
  }
});
function showBar() { clearTimeout(hideTimer); player.classList.add("show"); }
function hideBar() { player.classList.remove("show"); }
hot.addEventListener("mouseenter", showBar);
hot.addEventListener("click", () => {
  showBar();
  hideTimer = setTimeout(hideBar, 3500);
});
document.querySelector(".bar").addEventListener("mouseleave", hideBar);

  ];

  const MAP = {};
  THEMES.forEach(t => { MAP[t.id] = t; if (!t.sw) t.sw = [t.lo, t.a, t.hi, t.ink]; });

  function typeVars(t) {
    return { "--serif": t.font, "--h1-track": t.track || "-.03em", "--h1-weight": t.hw || 700, "--base-size": t.size || "1.05rem" };
  }
  function derive(t) {
    const a = t.a, bg = t.bg;
    return {
      "--bg": bg, "--ink": t.ink, "--muted": t.muted,
      "--line": rgba(a, .30), "--rule": rgba(a, .9),
      "--g1": t.lo, "--g2": t.hi, "--g3": mix(t.lo, t.hi, .4), "--hi": t.hi,
      "--tint": rgba(a, .06), "--hover": rgba(a, .16),
      "--panel": rgba(mix(bg, a, .07), .92), "--panel2": rgba(mix(bg, a, .09), .85),
      "--btn-bg": "linear-gradient(180deg, " + rgba(a, .14) + ", transparent 48%), " + mix(bg, a, .08),
      "--btn-edge": "inset 0 1px 0 " + rgba(a, .30) + ", inset 0 0 0 1px " + rgba(a, .05),
      "--blank-bg": "linear-gradient(180deg, rgba(0,0,0,.16), transparent 48%), " + mix(t.hi, a, .15),
      "--blank-fg": "#050505", "--blank-border": "rgba(0,0,0,.65)"
    };
  }
  function varsOf(t) { return Object.assign(typeVars(t), t.vars || derive(t)); }

  let cur = THEMES[0];
  let W = 0, H = 0;
  let lastFrame = 0;
  let animationId = null;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- INK ---------- */
  const bundles = [];
  for (let b = 0; b < 3; b++) {
    bundles.push({
      y: (b + .5) / 3,
      amp: 45 + Math.random() * 65,
      f: .002 + Math.random() * .002,
      sp: .2 + Math.random() * .2,
      ph: Math.random() * 6.28,
      tilt: (Math.random() - .5) * .15,
      gap: 9 + Math.random() * 5,
      n: 4
    });
  }

  function drawInk(t) {
    ctx.fillStyle = "#030302";
    ctx.fillRect(0, 0, W, H);
    const clouds = [
      [W * .2, H * .25, Math.max(W, H) * .65],
      [W * .8, H * .7, Math.max(W, H) * .55],
      [W * .5, H * .5, Math.max(W, H) * .8]
    ];
    for (let i = 0; i < clouds.length; i++) {
      const c = clouds[i];
      const g = ctx.createRadialGradient(c[0], c[1], 0, c[0], c[1], c[2]);
      g.addColorStop(0, "rgba(120,115,105,.055)");
      g.addColorStop(.5, "rgba(65,60,55,.025)");
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }
    ctx.lineCap = "round";
    for (const bd of bundles) {
      for (let i = 0; i < bd.n; i++) {
        const k = i - (bd.n - 1) / 2;
        ctx.beginPath();
        for (let x = -20; x <= W + 20; x += 32) {
          const weave = 1 + .6 * Math.sin(x * bd.f * .7 + bd.ph + t * .00015);
          const y = bd.y * H
            + bd.tilt * (x - W / 2)
            + Math.sin(x * bd.f + bd.ph + t * .0005 * bd.sp) * bd.amp
            + Math.sin(x * bd.f * 2 + i * .5 + t * .0007 * bd.sp) * bd.amp * .2
            + k * bd.gap * weave;
          if (x === -20) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        const edge = 1 - Math.abs(k) / (bd.n / 2);
        ctx.strokeStyle = "rgba(220,215,200," + (.035 + edge * .13) + ")";
        ctx.lineWidth = .7 + edge * 1.2;
        ctx.stroke();
      }
    }
  }

  /* ---------- KELP PHOTO ---------- */
  const bgImg = new Image();
  let imgOk = false;
  bgImg.onload = () => { imgOk = true; updateCanvasVisibility(); if (cur.type === "kelp") drawSea(performance.now()); };
  bgImg.src = KELP_IMAGE;

  function drawSea(t) {
    if (!imgOk) return;
    const iw = bgImg.naturalWidth, ih = bgImg.naturalHeight;
    const A = W / 1920;                 // sway scales with screen width
    const maxShift = 11 * A;
    let sc = Math.max(W / iw, H / ih);  // same "cover" fit as the CSS background
    if (iw * sc < W + 2 * maxShift) sc = (W + 2 * maxShift) / iw; // just enough extra width to hide the moving edges
    const dw = iw * sc, dh = ih * sc;
    const ox = (W - dw) / 2, oy = (H - dh) / 2;
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    const step = 3;
    /* The photo is drawn in thin horizontal strips. Each strip is nudged
       sideways by slow travelling waves that grow toward the top and fade to
       zero at the bottom, so the kelp stays rooted and bends like in a current.
       Nothing is added to the picture. */
    for (let y = 0; y < H; y += step) {
      const k = Math.pow(1 - y / H, 1.3);
      const shift = k * A * (
          5   * Math.sin(y * .0075 - t * .0011)
        + 2.2 * Math.sin(y * .016  - t * .0018 + 1.7)
        + 3   * Math.sin(t * .0006)
      );
      const sy = (y - oy) / sc;
      const sh = Math.min((step + 1) / sc, ih - sy);
      if (sh <= 0) break;
      ctx.drawImage(bgImg, 0, sy, iw, sh, ox + shift, y, dw, sh * sc);
    }
  }

  /* ---------- SCENES: hand-built animated backgrounds (no pictures needed) ----------
     A theme becomes a scene theme by adding  { type: "scene", scene: "name" }
     to its line in THEMES. Each scene below has init() (set up once per resize)
     and draw() (runs every frame). To add another, copy one and give it a name.
     Many scenes react to the mouse / finger, using the shared "ptr" below. */
  const TAU = Math.PI * 2;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const ptr = { x: -1, y: -1, on: false, click: 0 };
  window.addEventListener("pointermove", e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; });
  window.addEventListener("pointerdown", e => { ptr.x = e.clientX; ptr.y = e.clientY; ptr.on = true; ptr.click = performance.now(); });
  document.documentElement.addEventListener("mouseleave", () => { ptr.on = false; });
  window.addEventListener("blur", () => { ptr.on = false; });
  function track(s, dt) {                    // smoothed pointer + parallax offsets (-.5 .. .5)
    const tx = ptr.on ? ptr.x : W / 2, ty = ptr.on ? ptr.y : H / 2;
    if (s.px === undefined) { s.px = tx; s.py = ty; s.hot = 0; s.lastClick = ptr.click; }
    const k = Math.min(1, dt * 4);
    s.px += (tx - s.px) * k; s.py += (ty - s.py) * k;
    s.ox = s.px / W - .5; s.oy = s.py / H - .5;
    s.hot += ((ptr.on ? 1 : 0) - s.hot) * Math.min(1, dt * 3);
    s.clicked = ptr.click > s.lastClick;
    if (s.clicked) s.lastClick = ptr.click;
  }

  const glowCache = {};
  function glow(col) {                       // soft round light, col = "r,g,b"
    if (glowCache[col]) return glowCache[col];
    const g = document.createElement("canvas");
    g.width = g.height = 64;
    const x = g.getContext("2d");
    const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(" + col + ",1)");
    gr.addColorStop(.25, "rgba(" + col + ",.45)");
    gr.addColorStop(1, "rgba(" + col + ",0)");
    x.fillStyle = gr;
    x.fillRect(0, 0, 64, 64);
    return (glowCache[col] = g);
  }
  function lamp(col, x, y, w, h, a, c) {     // draw a glow, w x h, centred on x,y
    const g = c || ctx;
    g.globalAlpha = a;
    g.drawImage(glow(col), x - w / 2, y - (h || w) / 2, w, h || w);
  }
  function offscreen(extra) {
    const o = document.createElement("canvas");
    o.width = Math.max(1, Math.round(W) + (extra || 0));
    o.height = Math.max(1, Math.round(H));
    return o;
  }
  function makeStars(n, maxY) {
    const a = [];
    for (let i = 0; i < n; i++) a.push({ x: rnd(0, W), y: rnd(0, maxY || H), r: rnd(.4, 1.5), ph: rnd(0, TAU), sp: rnd(.6, 2.2) });
    return a;
  }
  function drawStars(arr, t, col, amp) {
    ctx.fillStyle = col || "#fff";
    for (const s of arr) {
      ctx.globalAlpha = (amp || .8) * (.45 + .55 * Math.sin(t * .001 * s.sp + s.ph));
      ctx.fillRect(s.x, s.y, s.r, s.r);
      if (s.r > 1.3) {                       // the brightest stars get a little cross flare
        const f = Math.max(0, Math.sin(t * .0007 * s.sp + s.ph * 3));
        if (f > .6) { ctx.globalAlpha = (f - .6) * 1.6 * (amp || .8); ctx.fillRect(s.x - 4, s.y + s.r / 2 - .4, 9, .8); ctx.fillRect(s.x + s.r / 2 - .4, s.y - 4, .8, 9); }
      }
    }
    ctx.globalAlpha = 1;
  }
  function vGrad(c, stops, y0, y1) {
    const g = c.createLinearGradient(0, y0 || 0, 0, y1 === undefined ? H : y1);
    stops.forEach(s => g.addColorStop(s[0], s[1]));
    return g;
  }
  function ridgeY(base, amp, f, ph, x) {
    const n = x / W;
    return base - amp * (.55 * Math.sin(n * f * TAU + ph) + .3 * Math.sin(n * f * 2.3 * TAU + ph * 2.1) + .15 * Math.sin(n * f * 5.1 * TAU + ph * .7));
  }
  function ridge(c, base, amp, f, ph, fill) {  // mountain / hill silhouette
    c.beginPath();
    c.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) c.lineTo(x, ridgeY(base, amp, f, ph, x));
    c.lineTo(W, H);
    c.closePath();
    c.fillStyle = fill;
    c.fill();
  }
  function shoot(s, dt, rate) {              // occasional shooting star
    if (!s.sh && Math.random() < rate * dt) s.sh = { x: rnd(W * .3, W), y: rnd(0, H * .35), vx: -rnd(500, 800), vy: rnd(200, 360), life: 1 };
    const q = s.sh;
    if (!q) return;
    q.x += q.vx * dt; q.y += q.vy * dt; q.life -= dt * 1.4;
    if (q.life <= 0) { s.sh = null; return; }
    const g = ctx.createLinearGradient(q.x, q.y, q.x - q.vx * .12, q.y - q.vy * .12);
    g.addColorStop(0, "rgba(255,255,255," + q.life + ")"); g.addColorStop(1, "rgba(160,140,255,0)");
    ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - q.vx * .12, q.y - q.vy * .12); ctx.stroke();
  }
  function makeBands(defs) {
    return defs.map(d => {
      const len = H * d.len;
      const g = ctx.createLinearGradient(0, 0, 0, len);
      g.addColorStop(0, "rgba(" + d.c + ",0)");
      g.addColorStop(.7, "rgba(" + d.c + ",.45)");
      g.addColorStop(.88, "rgba(" + d.c + ",.9)");
      g.addColorStop(1, "rgba(" + d.c + ",0)");
      return Object.assign({ grad: g, length: len }, d);
    });
  }
  function drawBands(bands, t, scale, hot) {  // aurora curtains; they glow and ripple near the pointer
    ctx.globalCompositeOperation = "lighter";
    for (const b of bands) {
      ctx.fillStyle = b.grad;
      for (let x = 0; x < W + 8; x += 8) {
        const n = x / W;
        let top = H * b.base + Math.sin(n * b.f1 * TAU + t * .00018 * b.sp + b.ph) * H * .07
                              + Math.sin(n * b.f2 * TAU - t * .00025 * b.sp) * H * .03;
        const br = .5 + .5 * Math.sin(n * b.f3 * TAU + t * .0005 * b.sp + b.ph * 2);
        const bo = hot ? hot * Math.max(0, 1 - Math.abs(x - ptr.x) / 220) : 0;
        top += Math.sin(t * .008 + x * .06) * bo * 7;
        ctx.globalAlpha = Math.min(1, (.10 + .5 * br * br) * scale + bo * .35 * scale);
        ctx.save();
        ctx.translate(0, top - b.length * .88);
        ctx.fillRect(x, 0, 9, b.length);
        ctx.restore();
      }
    }
    ctx.globalCompositeOperation = "source-over";
    ctx.globalAlpha = 1;
  }
  function bat(x, y, sc, flip, fl) {         // little bat silhouette; fl = wing flap -1..1
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(sc * (flip ? -1 : 1), sc);
    for (let side = 1; side >= -1; side -= 2) {
      ctx.save(); ctx.scale(side, 1);
      ctx.beginPath(); ctx.moveTo(0, -2);
      ctx.quadraticCurveTo(12, -12 * fl - 3, 26, -4 * fl + 3);
      ctx.quadraticCurveTo(18, 2, 12, 4);
      ctx.quadraticCurveTo(6, 0, 0, 3);
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.beginPath(); ctx.ellipse(0, 1, 3, 5, 0, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2.4, -3); ctx.lineTo(-1.6, -7); ctx.lineTo(-.4, -4); ctx.moveTo(2.4, -3); ctx.lineTo(1.6, -7); ctx.lineTo(.4, -4); ctx.fill();
    ctx.restore();
  }
  function wire(vs, es, cx, cy, size, rx, ry, col) {   // spinning neon wireframe
    const cr = Math.cos(rx), sr = Math.sin(rx), cq = Math.cos(ry), sq = Math.sin(ry);
    const p = vs.map(v => {
      let x = v[0] * cq + v[2] * sq, z = -v[0] * sq + v[2] * cq, y = v[1];
      const y2 = y * cr - z * sr, z2 = y * sr + z * cr;
      const f = 3 / (3 + z2);
      return [cx + x * f * size, cy + y2 * f * size];
    });
    for (let pass = 0; pass < 2; pass++) {
      ctx.strokeStyle = col; ctx.lineWidth = pass ? 1.4 : 6; ctx.globalAlpha = pass ? .9 : .14;
      ctx.beginPath();
      for (const e of es) { ctx.moveTo(p[e[0]][0], p[e[0]][1]); ctx.lineTo(p[e[1]][0], p[e[1]][1]); }
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  const SCENES = {};

  /* EMBER: rising sparks, smoke, cracked glowing rock.
     Mouse: sparks swirl away from it and it leaves a trail of embers. Click: burst. */
  SCENES.ember = {
    init(s) {
      s.mk = first => ({ x: rnd(0, W), y: first ? rnd(0, H) : H * rnd(.9, 1.02), ex: 0, ey: 0, vy: rnd(28, 95), r: rnd(2, 6), ph: rnd(0, TAU), sw: rnd(8, 38), hot: Math.random() < .3 });
      s.p = [];
      for (let i = 0; i < 110; i++) s.p.push(s.mk(true));
      s.smoke = [];
      for (let i = 0; i < 12; i++) s.smoke.push({ x: rnd(0, W), y: rnd(H * .3, H), r: rnd(70, 150), vy: rnd(8, 20), ph: rnd(0, TAU) });
      const o = offscreen(), x = o.getContext("2d");
      ridge(x, H * .93, H * .05, 2.2, 1.3, "#060100");
      ridge(x, H * .975, H * .03, 3.1, 4, "#020000");
      s.rock = o;
      s.cracks = [];
      for (let i = 0; i < 10; i++) {
        let cx = rnd(0, W), cy = H * rnd(.95, .995);
        const pts = [[cx, cy]];
        for (let k = 0; k < 5; k++) { cx += rnd(-40, 40); cy += rnd(-9, 9); pts.push([cx, Math.min(H, cy)]); }
        s.cracks.push({ pts: pts, ph: rnd(0, TAU) });
      }
      s.lp = { x: -1, y: -1 };
    },
    draw(t, dt, s) {
      track(s, dt);
      ctx.fillStyle = vGrad(ctx, [[0, "#070100"], [.6, "#1c0700"], [1, "#4a1500"]]);
      ctx.fillRect(0, 0, W, H);
      const pulse = .85 + .15 * Math.sin(t * .0017) + .05 * Math.sin(t * .0043);
      const rg = ctx.createRadialGradient(W / 2, H * 1.08, 0, W / 2, H * 1.08, H * .95);
      rg.addColorStop(0, "rgba(255,110,20," + (.6 * pulse) + ")");
      rg.addColorStop(.45, "rgba(255,60,0," + (.2 * pulse) + ")");
      rg.addColorStop(1, "rgba(255,40,0,0)");
      ctx.fillStyle = rg;
      ctx.fillRect(0, 0, W, H);
      for (const m of s.smoke) {
        m.y -= m.vy * dt; m.r += 3 * dt;
        if (m.y < -m.r) { m.y = H + m.r * .5; m.r = rnd(70, 150); m.x = rnd(0, W); }
        lamp("50,25,15", m.x + Math.sin(t * .0004 + m.ph) * 40, m.y, m.r * 2, m.r * 2, .10 * clamp(m.y / (H * .6), 0, 1));
      }
      ctx.globalAlpha = 1;
      ctx.drawImage(s.rock, 0, 0, W, H);
      ctx.globalCompositeOperation = "lighter";
      ctx.lineCap = "round"; ctx.lineJoin = "round";
      for (const c of s.cracks) {
        const a = .55 + .45 * Math.sin(t * .002 + c.ph);
        for (let pass = 0; pass < 2; pass++) {
          ctx.strokeStyle = pass ? "rgba(255,200,90,1)" : "rgba(255,90,10,1)";
          ctx.lineWidth = pass ? 1.5 : 6; ctx.globalAlpha = (pass ? .9 : .25) * a;
          ctx.beginPath();
          c.pts.forEach((q, i) => i ? ctx.lineTo(q[0], q[1]) : ctx.moveTo(q[0], q[1]));
          ctx.stroke();
        }
      }
      const wind = Math.sin(t * .0003) * 18 + Math.max(0, Math.sin(t * .0011)) * 20;
      if (s.clicked) for (let i = 0; i < 40; i++) { const a = rnd(0, TAU), v = rnd(120, 340); const p = s.mk(false); p.x = ptr.x; p.y = ptr.y; p.ex = Math.cos(a) * v; p.ey = Math.sin(a) * v; p.vy = rnd(10, 60); p.burst = 1; p.hot = Math.random() < .5; s.p.push(p); }
      if (ptr.on && Math.hypot(ptr.x - s.lp.x, ptr.y - s.lp.y) > 8 && s.p.length < 320) {
        s.lp.x = ptr.x; s.lp.y = ptr.y;
        const p = s.mk(false); p.x = ptr.x + rnd(-6, 6); p.y = ptr.y + rnd(-6, 6); p.r = rnd(1.5, 3.5); p.vy = rnd(30, 70); p.ex = rnd(-30, 30); p.burst = .6; p.hot = Math.random() < .6; s.p.push(p);
      }
      for (let i = s.p.length - 1; i >= 0; i--) {
        const p = s.p[i];
        if (ptr.on) {
          const dx = p.x - ptr.x, dy = p.y - ptr.y, d2 = dx * dx + dy * dy;
          if (d2 < 130 * 130 && d2 > 1) { const d = Math.sqrt(d2), f = (1 - d / 130) * 700 * dt; p.ex += dx / d * f + dy / d * f * .6; p.ey += dy / d * f - dx / d * f * .6; }
        }
        const dec = 1 - Math.min(1, dt * 1.5);
        p.ex *= dec; p.ey *= dec;
        p.y += (-p.vy + p.ey) * dt;
        p.x += (Math.sin(t * .0012 + p.ph) * p.sw + wind * .6 + p.ex) * dt;
        if (p.burst) { p.burst -= dt * .55; if (p.burst <= 0) { s.p.splice(i, 1); continue; } }
        else if (p.y < -20 || p.y > H + 60) { s.p[i] = s.mk(false); continue; }
        const k = clamp(p.y / H, 0, 1);
        const a = Math.min(1, k * 1.5) * (.6 + .4 * Math.sin(t * .009 + p.ph)) * (p.burst ? Math.min(1, p.burst * 1.6) : 1);
        const sz = p.r * (3 + k * 4);
        lamp(p.hot ? "255,205,100" : "255,120,30", p.x, p.y, sz, sz, a);
      }
    }
  };

  /* MATRIX: two depths of falling glyphs, glyphs that flicker and change.
     Mouse: columns near it race down. Click: a wave of speed around the click. */
  const MCH = (function () {
    let a = "";
    for (let c = 0xFF71; c <= 0xFF9D; c++) a += String.fromCharCode(c);
    return a + "0123456789";
  })();
  function matrixStep(s, dt, fade) {
    ctx.fillStyle = "rgba(0,0,0," + fade + ")";
    ctx.fillRect(0, 0, W, H);
    ctx.textBaseline = "top";
    for (const c of s.cols) {
      const cs = c.cs;
      const near = ptr.on && Math.abs(c.x + cs / 2 - ptr.x) < 70;
      c.boost = Math.max(0, (c.boost || 0) - dt);
      c.y += c.v * dt * (near ? 2.6 : 1) * (1 + 3 * c.boost);
      const row = Math.floor(c.y);
      if (row === c.row) continue;
      ctx.font = cs + "px monospace";
      if (c.row >= 0 && c.ch) {
        ctx.fillStyle = "#000"; ctx.fillRect(c.x, c.row * cs, cs, cs);
        ctx.fillStyle = c.col; ctx.fillText(c.ch, c.x, c.row * cs);
      }
      c.row = row;
      if (row * cs > H) { c.y = rnd(-40, 0); c.v = c.far ? rnd(5, 15) : rnd(8, 26); c.row = -999; c.ch = ""; continue; }
      if (row < 0) continue;
      c.ch = MCH[Math.floor(Math.random() * MCH.length)];
      ctx.fillStyle = near ? "#ffffff" : c.head;
      ctx.fillText(c.ch, c.x, row * cs);
    }
    for (let k = 0; k < 4; k++) {            // old glyphs in a trail flicker into new ones
      const c = s.cols[Math.floor(Math.random() * s.cols.length)];
      const row = c.row - Math.floor(rnd(2, 14));
      if (row >= 0 && c.row > 0) {
        ctx.font = c.cs + "px monospace";
        ctx.fillStyle = "#000"; ctx.fillRect(c.x, row * c.cs, c.cs, c.cs);
        ctx.globalAlpha = .55; ctx.fillStyle = c.col;
        ctx.fillText(MCH[Math.floor(Math.random() * MCH.length)], c.x, row * c.cs);
        ctx.globalAlpha = 1;
      }
    }
  }
  SCENES.matrix = {
    init(s) {
      s.cols = [];
      for (let x = 0; x < W; x += 11) s.cols.push({ x: x, cs: 11, far: 1, y: rnd(-H / 11, 0), v: rnd(5, 15), row: -999, ch: "", col: "#007a22", head: "#6fd48c" });
      for (let x = 0; x < W; x += 17) s.cols.push({ x: x, cs: 17, far: 0, y: rnd(-H / 17, 0), v: rnd(8, 26), row: -999, ch: "", col: "#00e83a", head: "#d4ffe0" });
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, W, H);
      for (let i = 0; i < 280; i++) matrixStep(s, 1 / 30, .07);   // pre-fill so it never starts empty
    },
    draw(t, dt, s) {
      track(s, dt);
      if (s.clicked) for (const c of s.cols) if (Math.abs(c.x - ptr.x) < 220) c.boost = 1;
      if (dt > 0) matrixStep(s, dt, .07);
      if (ptr.on) lamp("0,255,65", ptr.x, ptr.y, 130, 130, .22);
      ctx.globalAlpha = 1;
    }
  };

  /* AURORA: curtains over a snowy night, pines, a cabin with smoke, shooting stars.
     Mouse: the curtains near it glow and ripple. */
  SCENES.aurora = {
    init(s) {
      s.stars = makeStars(150, H * .7);
      s.bands = makeBands([
        { base: .30, len: .42, c: "94,234,212", f1: 1.3, f2: 3.1, f3: 7, sp: 1,   ph: 0 },
        { base: .36, len: .36, c: "56,189,248", f1: 1.8, f2: 2.4, f3: 9, sp: .8,  ph: 2 },
        { base: .26, len: .34, c: "167,139,250", f1: 1.1, f2: 3.7, f3: 6, sp: 1.2, ph: 4 }
      ]);
      const o = offscreen(), x = o.getContext("2d");
      ridge(x, H * .86, H * .09, 1.4, 1, "#041018");
      const fy = xx => ridgeY(H * .86, H * .09, 1.4, 1, xx);
      x.fillStyle = "#030c12";
      const cabx = W * .72;
      for (let i = 0; i < W / 20; i++) {
        const px = rnd(0, W);
        if (Math.abs(px - cabx) < 70) continue;
        const base = fy(px) + 6, h = rnd(.045, .1) * H, w = h * .38;
        for (let k = 0; k < 3; k++) {
          const yy = base - h * (.18 + k * .3), ww = w * (1 - k * .27);
          x.beginPath(); x.moveTo(px, yy - h * .42); x.lineTo(px - ww, yy); x.lineTo(px + ww, yy); x.closePath(); x.fill();
        }
        x.fillRect(px - 1.5, base - h * .2, 3, h * .22);
      }
      ridge(x, H * .93, H * .07, 2.1, 3, "#02080d");
      const cy = fy(cabx) + 3;
      x.fillStyle = "#02060a";
      x.fillRect(cabx, cy - 20, 36, 22);
      x.beginPath(); x.moveTo(cabx - 5, cy - 20); x.lineTo(cabx + 18, cy - 36); x.lineTo(cabx + 41, cy - 20); x.closePath(); x.fill();
      x.fillRect(cabx + 26, cy - 40, 5, 14);
      s.hills = o;
      s.win = { x: cabx + 7, y: cy - 14 };
      s.chim = { x: cabx + 28, y: cy - 42 };
      s.puffs = [];
      s.pt = 0;
    },
    draw(t, dt, s) {
      track(s, dt);
      ctx.fillStyle = vGrad(ctx, [[0, "#01030a"], [.6, "#06142a"], [1, "#0b2a3c"]]);
      ctx.fillRect(0, 0, W, H);
      drawStars(s.stars, t, "#dfeeff", .8);
      shoot(s, dt, .12);
      drawBands(s.bands, t, 1, s.hot);
      ctx.drawImage(s.hills, 0, 0, W, H);
      const fl = .85 + .15 * Math.sin(t * .011) * Math.sin(t * .0037);
      ctx.globalCompositeOperation = "lighter";
      lamp("255,180,80", s.win.x + 4, s.win.y + 4, 46, 46, .75 * fl);
      ctx.globalAlpha = fl; ctx.fillStyle = "#ffd27a"; ctx.fillRect(s.win.x, s.win.y, 8, 8);
      ctx.globalCompositeOperation = "source-over";
      s.pt -= dt;
      if (s.pt <= 0) { s.pt = .45; s.puffs.push({ x: s.chim.x + 2, y: s.chim.y, r: 3, a: 1 }); }
      for (let i = s.puffs.length - 1; i >= 0; i--) {
        const p = s.puffs[i];
        p.y -= 16 * dt; p.x += (7 + Math.sin(t * .001 + p.y * .05) * 5) * dt; p.r += 6 * dt; p.a -= dt * .28;
        if (p.a <= 0) { s.puffs.splice(i, 1); continue; }
        lamp("165,180,195", p.x, p.y, p.r * 2, p.r * 2, p.a * .22);
      }
      ctx.globalAlpha = 1;
    }
  };

  /* VAPORWAVE: striped sun, neon mountains, scrolling grid, palms, spinning wireframes.
     Mouse: the whole scene slides in 3D-ish parallax and the grid follows it. */
  SCENES.vapor = {
    init(s) {
      s.stars = makeStars(90, H * .45);
      s.scan = offscreen();
      const x = s.scan.getContext("2d");
      x.fillStyle = "rgba(0,0,0,.2)";
      for (let y = 0; y < H; y += 3) x.fillRect(0, y, W, 1);
      s.mts = [];
      for (let xx = -60; xx < W + 80; xx += W / 9) { s.mts.push([xx, -rnd(.05, .13) * H]); s.mts.push([xx + W / 18, -rnd(.005, .04) * H]); }
      s.cubeV = []; for (let i = 0; i < 8; i++) s.cubeV.push([(i & 1) * 2 - 1, ((i >> 1) & 1) * 2 - 1, ((i >> 2) & 1) * 2 - 1]);
      s.cubeE = []; for (let i = 0; i < 8; i++) for (let b = 0; b < 3; b++) if (!(i & (1 << b))) s.cubeE.push([i, i | (1 << b)]);
      s.pyrV = [[0, -1.3, 0], [-1, .8, -1], [1, .8, -1], [1, .8, 1], [-1, .8, 1]];

    },
    draw(t, dt, s) {
      track(s, dt);
      const hz = H * .58, ox = s.ox;
      const sky = vGrad(ctx, [[0, "#12002e"], [.55, "#4b0a6e"], [.88, "#ff4fa8"], [1, "#ff9a6a"]], 0, hz);
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, hz);
      drawStars(s.stars, t, "#ffe6ff", .7);
      shoot(s, dt, .1);
      const R = Math.min(W, H) * .22 * (1 + .015 * Math.sin(t * .0012)), cx = W / 2 - ox * 26, cy = hz - R * .55;
      ctx.globalCompositeOperation = "lighter";

      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.beginPath(); ctx.rect(0, 0, W, hz); ctx.clip();
      ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();
      const sg = ctx.createLinearGradient(0, cy - R, 0, cy + R);
      sg.addColorStop(0, "#fffb96"); sg.addColorStop(.5, "#ff9ad5"); sg.addColorStop(1, "#ff3d9a");
      ctx.fillStyle = sg;
      ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
      ctx.fillStyle = sky;
      const off = (t * .00006) % 1;
      for (let i = 0; i < 8; i++) {
        const f = (i + off) / 8;
        ctx.fillRect(cx - R, cy + R * .02 + f * R * .98, R * 2, 2 + f * R * .14);
      }
      ctx.restore();
      ctx.beginPath();                          // neon mountain outline on the horizon
      ctx.moveTo(-60, hz);
      for (const p of s.mts) ctx.lineTo(p[0] - ox * 40, hz + p[1]);
      ctx.lineTo(W + 80, hz);
      ctx.closePath();
      ctx.fillStyle = "#1a0540"; ctx.fill();
      ctx.lineJoin = "round"; ctx.strokeStyle = "#ff71ce"; ctx.lineWidth = 1.5; ctx.globalAlpha = .85; ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = vGrad(ctx, [[0, "#1a0538"], [1, "#07001a"]], hz, H);
      ctx.fillRect(0, hz, W, H - hz);
      ctx.lineCap = "round";
      ctx.strokeStyle = "#ff71ce"; ctx.lineWidth = 2; ctx.globalAlpha = .9;
      ctx.beginPath(); ctx.moveTo(0, hz); ctx.lineTo(W, hz); ctx.stroke();
      const vx = W / 2 + ox * 90;
      ctx.strokeStyle = "#01cdfe";
      for (let pass = 0; pass < 2; pass++) {
        ctx.lineWidth = pass ? 1 : 4;
        ctx.globalAlpha = pass ? .85 : .13;
        ctx.beginPath();
        for (let i = -14; i <= 14; i++) { ctx.moveTo(vx, hz); ctx.lineTo(W / 2 + i * W * .11, H); }
        const off2 = (t * .00035) % 1;
        for (let j = 0; j < 14; j++) {
          const f = (j + off2) / 14;

          ctx.moveTo(0, y); ctx.lineTo(W, y);

      }
      ctx.globalAlpha = 1;
      wire(s.cubeV, s.cubeE, W * .17 + ox * 30, H * .27 + Math.sin(t * .0011) * 9, Math.min(W, H) * .045, t * .0004, t * .0007, "#01cdfe");
      wire(s.pyrV, s.pyrE, W * .84 + ox * 30, H * .22 + Math.sin(t * .0013 + 2) * 9, Math.min(W, H) * .05, .25, t * .0006, "#ff71ce");
      function palm(px, base, h, lean, ph) {

        const tx = px + lean + sw, ty = base - h;
        ctx.strokeStyle = "#08001c"; ctx.lineWidth = Math.max(5, h * .028);

          const a = -Math.PI * (.05 + .9 * k / 7) + Math.sin(t * .0013 + ph + k) * .06;
          const len = h * (.34 + .06 * (k % 2));
          ctx.beginPath(); ctx.moveTo(tx, ty);
          ctx.quadraticCurveTo(tx + Math.cos(a) * len * .55, ty + Math.sin(a) * len * .55 - len * .18, tx + Math.cos(a) * len, ty + Math.sin(a) * len + len * .3);

      if (ptr.on) { ctx.globalCompositeOperation = "lighter"; lamp("1,205,254", ptr.x, ptr.y, 150, 150, .16); ctx.globalCompositeOperation = "source-over"; }

  /* CYBERPUNK: rainy neon city with flying cars, a searchlight, a hologram ring,
     wet street reflections and ripples. Mouse: you carry an umbrella of cyan light, rain bends round it. */
  SCENES.cyberpunk = {
    init(s) {
      const gy = H * .92;
      s.gy = gy;
      const o = offscreen(), x = o.getContext("2d");
      x.fillStyle = vGrad(x, [[0, "#070112"], [.55, "#240538"], [1, "#6a0f52"]]);
      x.fillRect(0, 0, W, H);
      const cols = ["#1b0b3a", "#120728", "#09031a"];
      const lit = ["#ffd36b", "#7df9ff", "#ff5fd2"];
      s.tops = []; s.blink = []; s.beacons = [];
      for (let L = 0; L < 3; L++) {
        let bx = -rnd(10, 60);
        while (bx < W) {
          const bw = rnd(46, 120) * (1 + L * .15);
          const bh = rnd(H * .16, H * (.5 - L * .08));
          x.fillStyle = cols[L];
          x.fillRect(bx, H - bh, bw, bh);
          if (Math.random() < .35) { x.fillRect(bx + bw * .45, H - bh - rnd(14, 40), 2, 40); if (L > 0) s.beacons.push({ x: bx + bw * .45 + 1, y: H - bh - 14 + 0, ph: rnd(0, 6) }); }
          if (L > 0) {
            for (let wy = H - bh + 10; wy < gy - 6; wy += 11) {
              for (let wx = bx + 6; wx < bx + bw - 8; wx += 9) {
                if (Math.random() < .17) {
                  const col = pick(lit);
                  x.fillStyle = col; x.globalAlpha = rnd(.25, .8);
                  x.fillRect(wx, wy, 4, 5);
                  if (L === 2 && Math.random() < .08) s.blink.push({ x: wx, y: wy, col: col, ph: rnd(0, 20) });
                }
              }
            }
            x.globalAlpha = 1;
          }
          if (L === 2 && bh > H * .3) s.tops.push({ x: bx + bw * rnd(.15, .85), y: H - bh + rnd(30, 90), top: H - bh, cx: bx + bw / 2 });
          bx += bw + rnd(-4, 8);
        }
      }
      s.city = o;
      s.signs = s.tops.slice().sort(() => Math.random() - .5).slice(0, 5).map(p => ({
        x: p.x, y: p.y, h: rnd(50, 130), col: Math.random() < .5 ? "255,42,109" : "0,240,255", ph: rnd(0, 50)
      }));
      const holo = s.tops.slice().sort((a, b) => a.top - b.top)[0];
      s.holo = holo ? { x: holo.cx, y: holo.top - 46 } : { x: W * .5, y: H * .3 };
      s.drops = [];
      for (let i = 0; i < 170; i++) s.drops.push({ x: rnd(-100, W), y: rnd(0, gy), l: rnd(10, 24), v: rnd(520, 900), gy: rnd(gy + 4, H) });
      s.rip = [];
      s.cars = [];
      s.carT = 0;
    },
    draw(t, dt, s) {
      track(s, dt);
      const gy = s.gy;
      ctx.drawImage(s.city, 0, 0, W, H);
      const sx = W * .5 + Math.sin(t * .0003) * W * .35;   // searchlight sweeping the clouds
      ctx.globalCompositeOperation = "lighter";
      const sl = ctx.createLinearGradient(sx, gy, sx + (sx - W / 2) * .3, 0);
      sl.addColorStop(0, "rgba(180,220,255,.0)"); sl.addColorStop(.3, "rgba(180,220,255,.10)"); sl.addColorStop(1, "rgba(180,220,255,.02)");
      ctx.globalAlpha = 1; ctx.fillStyle = sl;
      ctx.beginPath(); ctx.moveTo(sx - 6, gy); ctx.lineTo(sx + 6, gy); ctx.lineTo(sx + (sx - W / 2) * .3 + 70, 0); ctx.lineTo(sx + (sx - W / 2) * .3 - 70, 0); ctx.closePath(); ctx.fill();
      for (const n of s.signs) {
        const fl = Math.sin(t * .0007 * (1 + n.ph % 3) + n.ph) > .93 ? .2 : .75 + .25 * Math.sin(t * .004 + n.ph);
        lamp(n.col, n.x, n.y + n.h / 2, 70, n.h + 60, .45 * fl);
        ctx.globalAlpha = fl; ctx.fillStyle = "rgb(" + n.col + ")";
        ctx.fillRect(n.x - 1.5, n.y, 3, n.h);
        for (let r = 0; r < 4; r++) ctx.fillRect(n.x - 8, n.y + r * (n.h / 3.4) + 4, 16, 2);
      }
      for (const w of s.blink) {            // windows that switch on and off
        const on = Math.sin(t * .0006 + w.ph) > .2;
        if (on) { ctx.globalAlpha = .6; ctx.fillStyle = w.col; ctx.fillRect(w.x, w.y, 4, 5); }
      }
      for (const b of s.beacons) {          // red aircraft lights on the antennas
        if (Math.sin(t * .003 + b.ph) > .6) lamp("255,40,40", b.x, b.y, 14, 14, .9);
      }
      const h = s.holo, rr = 36;            // hologram ring
      for (let k = 0; k < 3; k++) {
        const rx = Math.abs(Math.cos(t * .0012 + k * 1.05)) * rr + 2;
        ctx.strokeStyle = k === 1 ? "rgba(255,42,109,1)" : "rgba(0,240,255,1)"; ctx.lineWidth = 1.6; ctx.globalAlpha = .75;
        ctx.beginPath(); ctx.ellipse(h.x, h.y + Math.sin(t * .0015) * 4, rx, rr, 0, 0, TAU); ctx.stroke();
      }
      lamp("0,240,255", h.x, h.y, 110, 110, .25);
      s.carT -= dt;
      if (s.carT <= 0) { s.carT = rnd(1.2, 3.5); const dir = Math.random() < .5 ? 1 : -1, far = Math.random() < .5; s.cars.push({ x: dir > 0 ? -40 : W + 40, y: rnd(H * .12, H * .55), v: dir * (far ? rnd(90, 150) : rnd(200, 320)), sz: far ? 1.4 : 2.4 }); }
      for (let i = s.cars.length - 1; i >= 0; i--) {
        const c = s.cars[i];
        c.x += c.v * dt;
        if (c.x < -80 || c.x > W + 80) { s.cars.splice(i, 1); continue; }
        const d = Math.sign(c.v), tl = 46 * c.sz / 2;
        const g = ctx.createLinearGradient(c.x, 0, c.x - d * tl, 0);
        g.addColorStop(0, "rgba(255,60,90,.55)"); g.addColorStop(1, "rgba(255,60,90,0)");
        ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.fillRect(Math.min(c.x, c.x - d * tl), c.y - c.sz / 2, tl, c.sz);
        lamp("255,250,220", c.x, c.y, 16 * c.sz / 2, 16 * c.sz / 2, .95);
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.fillStyle = vGrad(ctx, [[0, "#14051f"], [1, "#05010c"]], gy, H);   // wet street
      ctx.fillRect(0, gy, W, H - gy);
      ctx.save();
      ctx.beginPath(); ctx.rect(0, gy, W, H - gy); ctx.clip();
      ctx.globalAlpha = .32;
      ctx.translate(0, 2 * gy); ctx.scale(1, -1);
      ctx.drawImage(s.city, 0, 0, W, H);
      ctx.restore();
      ctx.strokeStyle = "rgba(160,220,255,1)";
      for (let i = s.rip.length - 1; i >= 0; i--) {
        const r = s.rip[i];
        r.r += 34 * dt;
        if (r.r > 22) { s.rip.splice(i, 1); continue; }
        ctx.globalAlpha = .35 * (1 - r.r / 22); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r * .3, 0, 0, TAU); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      ctx.lineWidth = 1;
      ctx.strokeStyle = "rgba(170,225,255,.28)";
      ctx.beginPath();
      for (const d of s.drops) {
        d.y += d.v * dt; d.x -= d.v * dt * .22;
        if (ptr.on) {
          const dx = d.x - ptr.x, dy = d.y - ptr.y;
          if (dx * dx + dy * dy < 90 * 90 && dy < 40) d.x += (dx >= 0 ? 1 : -1) * 260 * dt;
        }
        if (d.y > d.gy || d.x < -40) {
          if (d.y > d.gy && s.rip.length < 26) s.rip.push({ x: d.x, y: d.y, r: 0 });
          d.y = rnd(-60, 0); d.x = rnd(0, W + 120); d.gy = rnd(gy + 4, H);
        }
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + d.l * .22, d.y - d.l);
      }
      ctx.stroke();
      if (ptr.on) {
        ctx.globalCompositeOperation = "lighter";
        lamp("0,240,255", ptr.x, ptr.y - 20, 180, 140, .1);
        ctx.strokeStyle = "rgba(0,240,255,.35)"; ctx.lineWidth = 1.2; ctx.globalAlpha = 1;
        ctx.beginPath(); ctx.arc(ptr.x, ptr.y + 4, 70, Math.PI * 1.08, Math.PI * 1.92); ctx.stroke();
        ctx.globalCompositeOperation = "source-over";
      }
      ctx.globalAlpha = 1;
    }
  };

  /* SAKURA: a moonlit ravine. Blossom trees grow up and out of the cliff walls,
     lanterns hang in them, petals fall into a stream with the moon in it.
     Mouse: petals are blown away from it. Click: a puff of petals. */
  SCENES.sakura = {
    init(s) {
      const U = Math.min(W, H);
      const wob = (y, a) => W * .012 * Math.sin(y * .021 + a) + W * .008 * Math.sin(y * .057 + a * 2);
      const edgeL = y => W * (.095 + .09 * Math.pow(y / H, 1.4)) + wob(y, 0);
      const edgeR = y => W - (W * (.095 + .09 * Math.pow(y / H, 1.4)) + wob(y, 2.4));
      s.edgeL = edgeL; s.edgeR = edgeR;
      // sky + moon
      let o = offscreen(), x = o.getContext("2d");
      x.fillStyle = vGrad(x, [[0, "#12060d"], [.6, "#2a0f1f"], [1, "#4a1a30"]]);
      x.fillRect(0, 0, W, H);
      for (let i = 0; i < 70; i++) { x.globalAlpha = rnd(.2, .7); x.fillStyle = "#ffe6ee"; x.fillRect(rnd(0, W), rnd(0, H * .5), 1.2, 1.2); }
      x.globalAlpha = 1;
      s.mx = W * .5; s.my = H * .2;
      const mg = x.createRadialGradient(s.mx, s.my, 0, s.mx, s.my, U * .55);
      mg.addColorStop(0, "rgba(255,215,230,.5)"); mg.addColorStop(.25, "rgba(255,170,200,.18)"); mg.addColorStop(1, "rgba(255,150,190,0)");
      x.fillStyle = mg; x.fillRect(0, 0, W, H);
      x.fillStyle = "rgba(255,238,244,.95)";
      x.beginPath(); x.arc(s.mx, s.my, U * .06, 0, TAU); x.fill();
      x.fillStyle = "rgba(220,170,190,.35)";
      for (let i = 0; i < 6; i++) { x.beginPath(); x.arc(s.mx + rnd(-.04, .04) * U, s.my + rnd(-.04, .04) * U, rnd(.006, .014) * U, 0, TAU); x.fill(); }
      s.sky = o;
      // cliff walls
      o = offscreen(); x = o.getContext("2d");
      function wall(edge, right) {
        x.beginPath(); x.moveTo(right ? W : 0, -5);
        for (let y = -5; y <= H + 5; y += 6) x.lineTo(edge(y), y);
        x.lineTo(right ? W : 0, H + 5); x.closePath();
        x.fillStyle = vGrad(x, [[0, "#33162b"], [.6, "#46203a"], [1, "#240e1f"]]);
        x.fill();
        for (let i = 0; i < 300; i++) {          // rock strata and cracks
          const yy = rnd(0, H), e = edge(yy), len = rnd(18, 70);
          const xx = right ? rnd(e + 4, W) : rnd(0, e - 4);
          x.strokeStyle = Math.random() < .7 ? "rgba(0,0,0,.28)" : "rgba(255,170,200,.05)";
          x.lineWidth = rnd(1, 2.4);
          x.beginPath(); x.moveTo(xx, yy); x.lineTo(xx + len * (right ? 1 : -1) * .5, yy + rnd(-3, 3)); x.stroke();
        }
        x.strokeStyle = "rgba(255,190,215,.4)"; x.lineWidth = 2.5;   // moonlit rim
        x.beginPath();
        for (let y = -5; y <= H + 5; y += 6) y === -5 ? x.moveTo(edge(y), y) : x.lineTo(edge(y), y);
        x.stroke();
        for (let i = 0; i < 90; i++) {             // grassy tufts on the ledge
          const yy = rnd(0, H), e = edge(yy);
          x.strokeStyle = "rgba(255,170,200,.18)"; x.lineWidth = 1;
          x.beginPath(); x.moveTo(e, yy); x.lineTo(e + (right ? 1 : -1) * rnd(-3, 3) + (right ? -1 : 1) * rnd(2, 6), yy - rnd(3, 8)); x.stroke();
        }
      }
      wall(edgeL, false); wall(edgeR, true);
      s.cliff = o;
      // blossom trees, drawn once; they sway as one layer
      o = offscreen(); x = o.getContext("2d");
      s.trees = o;
      s.tips = [];
      function blossom(px, py) {
        const r = rnd(3, 6.5);
        x.fillStyle = pick(["rgba(255,183,204,.85)", "rgba(255,206,222,.9)", "rgba(255,150,184,.8)"]);
        for (let k = 0; k < 5; k++) {
          const a = k * TAU / 5 + rnd(0, .4);
          x.beginPath(); x.arc(px + Math.cos(a) * r * .7, py + Math.sin(a) * r * .7, r * .62, 0, TAU); x.fill();
        }
        x.fillStyle = "rgba(255,240,140,.9)";
        x.beginPath(); x.arc(px, py, r * .28, 0, TAU); x.fill();
      }
      function tree(x0, y0, ang, len, w, d, dir) {
        let a = (ang + Math.PI / 2) * dir;            // 0 = straight up, + = outward
        a = clamp(a, -.25, 1.0);
        ang = a * dir - Math.PI / 2;
        const x1 = x0 + Math.cos(ang) * len, y1 = y0 + Math.sin(ang) * len;
        x.strokeStyle = "#1a0911"; x.lineWidth = Math.max(1, w); x.lineCap = "round";
        x.beginPath(); x.moveTo(x0, y0);
        x.quadraticCurveTo((x0 + x1) / 2 + rnd(-6, 6) + dir * len * .05, (y0 + y1) / 2 + rnd(-6, 6), x1, y1);
        x.stroke();
        if (d <= 5) for (let k = 0; k < 1; k++) blossom(x0 + (x1 - x0) * rnd(.3, 1) + rnd(-8, 8), y0 + (y1 - y0) * rnd(.3, 1) + rnd(-8, 8));
        if (d <= 1) s.tips.push({ x: x1, y: y1 });
        if (d <= 0 || len < 10) {
          lamp("255,170,200", x1, y1, 46, 46, .11, x);
          x.globalAlpha = 1;
          for (let k = 0; k < 5; k++) blossom(x1 + rnd(-14, 14), y1 + rnd(-14, 14));
          return;
        }
        const n = d >= 5 ? 2 : (Math.random() < .45 ? 3 : 2);
        for (let k = 0; k < n; k++) tree(x1, y1, ang + (k - (n - 1) / 2) * rnd(.4, .7) + rnd(-.15, .15), len * rnd(.7, .84), w * .72, d - 1, dir);
      }
      [[.99, 1], [.78, .78], [.58, .6]].forEach(r => {
        const y = H * r[0], f = r[1];
        tree(edgeL(y) - 12, y + 4, -Math.PI / 2 + .45, U * .2 * f, U * .026 * f, 7, 1);
        tree(edgeR(y) + 12, y + 4, -Math.PI / 2 - .45, U * .2 * f, U * .026 * f, 7, -1);
      });
      s.lanterns = s.tips.slice().sort(() => Math.random() - .5).filter(p => p.y > H * .12 && p.y < H * .85).slice(0, 8).map(p => ({ x: p.x, y: p.y, ph: rnd(0, TAU) }));
      // falling + floating petals
      const mkp = () => ({ x: rnd(0, W), y: rnd(-H * .1, H * .9), vy: rnd(24, 60), vx: rnd(-14, 8), sz: rnd(4.5, 9), rot: rnd(0, TAU), vr: rnd(-1.4, 1.4), ph: rnd(0, TAU), ex: 0, ey: 0, col: pick(["#ffb3cc", "#ffc9dc", "#ff9fbd", "#ffd7e4"]) });
      s.mkp = mkp;
      s.petals = [];
      for (let i = 0; i < 60; i++) s.petals.push(mkp());
      s.wp = [];
      for (let i = 0; i < 26; i++) s.wp.push({ x: rnd(0, W), y: H * rnd(.93, .995), v: rnd(6, 18), ph: rnd(0, TAU), sz: rnd(3, 6) });
      s.rip = [];
    },
    draw(t, dt, s) {
      track(s, dt);
      const wind = 22 + 34 * Math.sin(t * .0003);
      ctx.drawImage(s.sky, 0, 0, W, H);
      const wy = H * .91;                         // the stream
      ctx.fillStyle = vGrad(ctx, [[0, "#2b1226"], [1, "#12060f"]], wy, H);
      ctx.fillRect(0, wy, W, H - wy);
      for (let i = 0; i < 14; i++) {              // moon on the water

      for (let i = 0; i < 20; i++) s.leaves.push({ x: rnd(0, W), y: rnd(-H * .2, H), vy: rnd(18, 40), vx: rnd(-6, 8), rot: rnd(0, TAU), vr: rnd(-1.5, 1.5), ph: rnd(0, TAU), sz: rnd(3.5, 6.5), col: pick(["#c9a23a", "#8fb33a", "#d9742a", "#6aa83a"]), ex: 0, ey: 0 });
    },
    draw(t, dt, s) {
      track(s, dt);
      const ex = s.ex, ox = s.ox;
      ctx.drawImage(s.bg, 0, 0, W, H);
      ctx.drawImage(s.lay[0], -ex - ox * 10, 0, W + ex * 2, H);
      ctx.drawImage(s.lay[1], -ex - ox * 24, 0, W + ex * 2, H);
      ctx.globalCompositeOperation = "lighter";
      for (const r of s.rays) {
        const a = .035 + .03 * Math.sin(t * .0004 * r.sp + r.ph);
        const sh = H * .3, rx = r.x - ox * 30;
        const g = ctx.createLinearGradient(0, 0, 0, H);
        g.addColorStop(0, "rgba(200,255,170," + a * 2.4 + ")");
        g.addColorStop(1, "rgba(200,255,170,0)");
        ctx.globalAlpha = 1; ctx.fillStyle = g;
        ctx.beginPath();
        ctx.moveTo(rx - r.w * .3, 0); ctx.lineTo(rx + r.w * .3, 0);
        ctx.lineTo(rx + r.w + sh, H); ctx.lineTo(rx - r.w + sh, H);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = "#e6ffc8";
      for (const m of s.motes) {                     // dust drifting in the light
        m.x += m.vx * dt + Math.sin(t * .0007 + m.ph) * 4 * dt; m.y += m.vy * dt;
        if (m.x < 0) m.x = W; else if (m.x > W) m.x = 0;
        if (m.y < 0) m.y = H; else if (m.y > H) m.y = 0;
        ctx.globalAlpha = .25 + .3 * Math.sin(t * .002 + m.ph);
        ctx.fillRect(m.x, m.y, 1.6, 1.6);
      }
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.drawImage(s.lay[2], -ex - ox * 46, 0, W + ex * 2, H);
      ctx.globalCompositeOperation = "lighter";
      for (let i = 0; i < 3; i++) lamp("150,220,170", W * (.3 + i * .22) + Math.sin(t * .0002 + i * 2) * W * .12, H * .93, W * .7, H * .28, .13);
      for (const m of s.mush) {                      // glowing mushrooms
        const p = .55 + .45 * Math.sin(t * .0015 + m.ph);
        lamp(m.c, m.x - ox * 46, m.y - m.r * .3, m.r * 7, m.r * 5, .3 * p);
      }
      ctx.globalCompositeOperation = "source-over";
      for (const m of s.mush) {
        const mx = m.x - ox * 46, p = .55 + .45 * Math.sin(t * .0015 + m.ph);
        ctx.globalAlpha = 1; ctx.fillStyle = "#16301f"; ctx.fillRect(mx - m.r * .14, m.y - m.r * .3, m.r * .28, m.r * .6);
        ctx.fillStyle = "rgba(" + m.c + "," + (.55 + .35 * p) + ")";
        ctx.beginPath(); ctx.ellipse(mx, m.y - m.r * .3, m.r, m.r * .6, 0, Math.PI, TAU); ctx.fill();
      }
      for (const l of s.leaves) {
        if (ptr.on) {
          const dx = l.x - ptr.x, dy = l.y - ptr.y, d2 = dx * dx + dy * dy;
          if (d2 < 120 * 120 && d2 > 1) { const d = Math.sqrt(d2), k = (1 - d / 120) * 420 * dt; l.ex += dx / d * k; l.ey += dy / d * k; }
        }
        const dec = 1 - Math.min(1, dt * 1.5);
        l.ex *= dec; l.ey *= dec;
        l.y += (l.vy + l.ey) * dt; l.x += (l.vx + Math.sin(t * .0013 + l.ph) * 22 + l.ex) * dt; l.rot += l.vr * dt;
        if (l.y > H + 12) { l.y = rnd(-40, -5); l.x = rnd(0, W); }
        ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot);
        ctx.scale(.4 + .6 * Math.abs(Math.cos(t * .002 + l.ph)), 1);
        ctx.globalAlpha = .85; ctx.fillStyle = l.col;
        ctx.beginPath(); ctx.ellipse(0, 0, l.sz, l.sz * .5, 0, 0, TAU); ctx.fill();
        ctx.restore();
      }
      ctx.globalCompositeOperation = "lighter";
      for (const f of s.flies) {
        f.a += rnd(-1, 1) * dt * 3;
        if (ptr.on) {
          const dx = ptr.x - f.x, dy = ptr.y - f.y, d = Math.hypot(dx, dy);
          if (d < 280 && d > 24) { let df = Math.atan2(dy, dx) - f.a; df = Math.atan2(Math.sin(df), Math.cos(df)); f.a += df * dt * 2.2; }
        }
        f.x += Math.cos(f.a) * f.v * dt;
        f.y += Math.sin(f.a) * f.v * dt;
        if (f.x < -10) f.x = W + 10; else if (f.x > W + 10) f.x = -10;
        if (f.y < H * .2) f.y = H * .2; else if (f.y > H + 10) f.y = H * .3;
        const p = Math.max(0, Math.sin(t * .0019 * f.sp + f.ph));
        lamp("190,255,100", f.x, f.y, 26, 26, p * p);
      }
      if (ptr.on) lamp("255,235,160", ptr.x, ptr.y, 170, 170, .12);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
    }
  };

  /* INDIGO: nebula, a ringed planet, parallax stars, flaring stars, satellites, shooting stars.

  SCENES.indigo = {
    init(s) {
      const o = offscreen(80), x = o.getContext("2d");
      x.fillStyle = "#03010d"; x.fillRect(0, 0, o.width, o.height);

      for (let i = 0; i < 7; i++) {

        const g = x.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, "rgba(" + c + ",.2)"); g.addColorStop(.5, "rgba(" + c + ",.07)"); g.addColorStop(1, "rgba(" + c + ",0)");
        x.fillStyle = g; x.fillRect(0, 0, o.width, H);

      s.neb = o;
      s.stars = [];
      for (let i = 0; i < 200; i++) { const L = i % 3; s.stars.push({ x: rnd(0, W), y: rnd(0, H), r: [.8, 1.3, 2][L], v: [2, 5, 10][L], ph: rnd(0, TAU), sp: rnd(.5, 2.4), a: [.5, .75, 1][L], L: L }); }
      s.bright = s.stars.filter(q => q.L === 2);
      s.pr = Math.min(W, H) * .11;
      s.pcx = W * .8; s.pcy = H * .72;
      s.sats = [{ x: rnd(0, W), y: rnd(H * .1, H * .5), v: rnd(14, 26) }, { x: rnd(0, W), y: rnd(H * .3, H * .8), v: -rnd(10, 18) }];
    },
    draw(t, dt, s) {
      track(s, dt);
      const ox = s.ox, oy = s.oy;
      ctx.drawImage(s.neb, -40 - ox * 24, -oy * 18, W + 80, H);
      ctx.globalCompositeOperation = "lighter";
      lamp("120,100,255", W * (.5 + .25 * Math.sin(t * .00007)), H * (.5 + .2 * Math.cos(t * .00009)), Math.max(W, H) * .8, Math.max(W, H) * .8, .12);
      ctx.globalCompositeOperation = "source-over";
      const pcx = s.pcx - ox * 60, pcy = s.pcy - oy * 40, R = s.pr;     // the planet
      const ring = (a0, a1, widths) => {
        widths.forEach((w, i) => {
          ctx.strokeStyle = "rgba(" + (i % 2 ? "190,170,255" : "130,110,230") + "," + (.55 - i * .1) + ")"; ctx.lineWidth = w;
          ctx.beginPath(); ctx.ellipse(pcx, pcy, R * (1.55 + i * .22), R * (.38 + i * .06), -.35, a0, a1); ctx.stroke();
        });
      };
      ctx.globalAlpha = 1;
      ring(Math.PI, TAU, [4, 2.5, 1.5]);
      const pg = ctx.createRadialGradient(pcx - R * .4, pcy - R * .4, R * .1, pcx, pcy, R);
      pg.addColorStop(0, "#9a86ff"); pg.addColorStop(.55, "#4a3aa8"); pg.addColorStop(1, "#150a40");
      ctx.save();
      ctx.beginPath(); ctx.arc(pcx, pcy, R, 0, TAU); ctx.clip();
      ctx.fillStyle = pg; ctx.fillRect(pcx - R, pcy - R, R * 2, R * 2);
      ctx.fillStyle = "rgba(255,150,230,.12)";
      for (let i = 0; i < 5; i++) ctx.fillRect(pcx - R, pcy - R + R * (.25 + i * .32) + Math.sin(t * .0003 + i) * 3, R * 2, R * .1);
      const sh = ctx.createRadialGradient(pcx + R * .55, pcy + R * .5, R * .2, pcx + R * .55, pcy + R * .5, R * 1.5);
      sh.addColorStop(0, "rgba(0,0,10,0)"); sh.addColorStop(1, "rgba(0,0,10,.75)");
      ctx.fillStyle = sh; ctx.fillRect(pcx - R, pcy - R, R * 2, R * 2);
      ctx.restore();
      ring(0, Math.PI, [4, 2.5, 1.5]);
      ctx.fillStyle = "#f2eeff";
      for (const st of s.stars) {
        st.x -= st.v * dt;
        if (st.x < -3) st.x = W + 3;
        const sx = st.x - ox * (st.L + 1) * 14, sy = st.y - oy * (st.L + 1) * 10;
        st.sx = sx; st.sy = sy;
        const tw = .4 + .6 * Math.sin(t * .0012 * st.sp + st.ph);
        ctx.globalAlpha = st.a * tw;
        ctx.fillRect(sx, sy, st.r, st.r);
        if (st.L === 2 && tw > .92) { ctx.globalAlpha = (tw - .92) * 9; ctx.fillRect(sx - 5, sy + .6, 11, .8); ctx.fillRect(sx + .6, sy - 5, .8, 11); }
      }
      if (ptr.on) {                                   // constellation lines near the pointer
        ctx.strokeStyle = "rgba(190,170,255,1)"; ctx.lineWidth = 1;
        const near = s.bright.filter(q => Math.hypot(q.sx - ptr.x, q.sy - ptr.y) < 220);
        for (let i = 0; i < near.length; i++) for (let j = i + 1; j < near.length; j++) {
          const d = Math.hypot(near[i].sx - near[j].sx, near[i].sy - near[j].sy);
          if (d < 130) {
            ctx.globalAlpha = (1 - d / 130) * .55 * (1 - Math.hypot((near[i].sx + near[j].sx) / 2 - ptr.x, (near[i].sy + near[j].sy) / 2 - ptr.y) / 240);
            ctx.beginPath(); ctx.moveTo(near[i].sx, near[i].sy); ctx.lineTo(near[j].sx, near[j].sy); ctx.stroke();
          }
        }
        ctx.globalCompositeOperation = "lighter";
        for (const q of near) lamp("200,180,255", q.sx, q.sy, 18, 18, .6);
        ctx.globalCompositeOperation = "source-over";
      }
      for (const sa of s.sats) {                      // slow satellites with a blink
        sa.x += sa.v * dt;
        if (sa.x > W + 10) sa.x = -10; else if (sa.x < -10) sa.x = W + 10;
        ctx.globalAlpha = .6; ctx.fillStyle = "#cfd6ff"; ctx.fillRect(sa.x, sa.y, 1.6, 1.6);
        if ((t * .001 + sa.y) % 2 < .15) lamp("255,255,255", sa.x + .8, sa.y + .8, 12, 12, .9);
      }
      shoot(s, dt, .15);
      ctx.globalAlpha = 1;
    }
  };

  /* ---------- PALETTE-DRIVEN SCENES ----------
     Each theme below is a short list of layers (SCN further down). Colours come
     from the theme itself (accent / low / high), so changing a theme's colours in
     THEMES recolours its scene too. To add detail later, add a layer or tweak a number.
     Mouse: every layer reacts to the cursor; click does something extra. */
  const LAYERS = {
    stars: {
      init(s, o) {
        s.st = makeStars(o.n || 200, H * .8);
        const c = offscreen(), x = c.getContext("2d");
        ridge(x, H * .9, H * .07, 1.7, 2, mix(cur.bg, cur.lo, .16));
        ridge(x, H * .97, H * .04, 2.6, 5, mix(cur.bg, cur.lo, .07));
        s.rd = c;
      },
      draw(t, dt, s, o, P) {
        ctx.save(); ctx.translate(-s.ox * 24, -s.oy * 14);
        drawStars(s.st, t, "rgb(" + P.H + ")", .85);
        ctx.restore();
        if (o.moon) lamp(P.H, W * .78 - s.ox * 40, H * .2 - s.oy * 20, 190, 190, .5);
        if (s.hot > .02) for (const q of s.st) { const d = Math.hypot(q.x - s.ox * 24 - ptr.x, q.y - ptr.y); if (d < 120) lamp(P.H, q.x - s.ox * 24, q.y - s.oy * 14, 14, 14, (1 - d / 120) * .7 * s.hot); }
        ctx.globalAlpha = 1; ctx.drawImage(s.rd, 0, 0, W, H);
        shoot(s, dt, .18);
      }
    },
    sun: {
      init(s, o) { s.fl = 0; },
      draw(t, dt, s, o, P) {
        const R = Math.min(W, H) * (o.R || .16), cx = o.fol ? W * .5 + s.ox * W * .45 : W * .5 - s.ox * 60, cy = H * (o.sy || .45) + (o.fol ? s.oy * H * .4 : -s.oy * 30); s.sx = cx; s.sy = cy; s.sR = R;
        if (s.clicked) s.fl = 1;
        s.fl = Math.max(0, s.fl - dt * .8);
        lamp(P.A, cx, cy, R * 9, R * 9, .55 + .1 * Math.sin(t * .001) + s.fl * .4);
        ctx.globalCompositeOperation = "lighter";
        ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * .00004);
        for (let i = 0; i < 28; i++) {
          const a = i / 28 * TAU, len = R * (2.2 + 1.3 * Math.sin(t * .0008 + i * 1.7)) * (1 + s.fl * .5);
          ctx.fillStyle = "rgba(" + (i % 2 ? P.H : P.A) + ",.07)";
          ctx.beginPath(); ctx.moveTo(Math.cos(a - .05) * R, Math.sin(a - .05) * R); ctx.lineTo(Math.cos(a) * len, Math.sin(a) * len); ctx.lineTo(Math.cos(a + .05) * R, Math.sin(a + .05) * R); ctx.fill();
        }
        ctx.restore();
        ctx.globalCompositeOperation = "source-over";
        const g = ctx.createRadialGradient(cx, cy - R * .3, R * .1, cx, cy, R);
        g.addColorStop(0, "rgb(" + P.H + ")"); g.addColorStop(1, "rgb(" + P.A + ")");
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fill();
        if (o.set) {
          const hy = cy + R * .45;
          ctx.fillStyle = mix(cur.bg, cur.lo, .06);
          for (let k = 0; k < 5; k++) ctx.fillRect(cx - R, hy - R * .9 + k * R * .17, R * 2, R * .02 * (k + 1));
          ctx.fillStyle = vGrad(ctx, [[0, mix(cur.bg, cur.lo, .45)], [1, cur.bg]], hy, H);
          ctx.fillRect(0, hy, W, H - hy);

          for (let k = 0; k < 14; k++) {
            const f = (k + 1) / 14, y = hy + f * f * (H - hy), w = R * (1.6 - f) * (1 + .3 * Math.sin(t * .002 + k));

    grid: {
      init(s, o) { s.gl = 0; },
      draw(t, dt, s, o, P) {
        const hy = H * .55 + s.oy * 24, vx = W / 2 + s.ox * 160;

          ctx.beginPath(); ctx.moveTo(vx, hy); ctx.lineTo(vx + i * W * .13, H); ctx.stroke();
        }
        const sc = (t * .0004) % 1;
        for (let k = 0; k < 16; k++) {
          const f = (k + sc) / 16, y = hy + (H - hy) * f * f;

    mesh: {
      init(s, o) {

        for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) s.mp.push({ x: (c - 1) * cell + rnd(-.3, .3) * cell, y: (r - 1) * cell + rnd(-.3, .3) * cell, ph: rnd(0, TAU) });
        s.mt = [];
        for (let r = 0; r < rows - 1; r++) for (let c = 0; c < cols - 1; c++) {
          const i = r * cols + c;

        for (const q of pts) { q.dx = Math.sin(t * .0005 + q.ph) * 5; q.dy = Math.cos(t * .0006 + q.ph) * 5; }
        for (const tr of s.mt) {
          const a = pts[tr[0]], b = pts[tr[1]], c = pts[tr[2]];
          const ax = a.x + a.dx, ay = a.y + a.dy, bx = b.x + b.dx, by = b.y + b.dy, cx = c.x + c.dx, cy = c.y + c.dy;
          const mx = (ax + bx + cx) / 3, my = (ay + by + cy) / 3;
          let al = tr[3] + sh * Math.pow(Math.max(0, Math.sin(t * .0007 * tr[5] + tr[4])), 6);
          if (s.hot > .02) { const d = Math.hypot(mx - ptr.x, my - ptr.y); if (d < 210) al += (1 - d / 210) * .3 * s.hot; }
          const dc = Math.abs(Math.hypot(mx - s.ck.x, my - s.ck.y) - rr);
          if (dc < 60 && rr < 1400) al += (1 - dc / 60) * .35;
          ctx.fillStyle = "rgba(" + (tr[4] > 3.1 ? P.H : P.A) + "," + Math.min(.8, al) + ")";
          ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.lineTo(cx, cy); ctx.closePath(); ctx.fill();
          ctx.strokeStyle = "rgba(" + P.H + ",.07)"; ctx.stroke();
        }

    },
    waves: {
      init(s, o) { s.k = 0; s.kx = 0; s.kt = 0; },
      draw(t, dt, s, o, P) {
        const n = o.n || 5; s.wo = o; s.wt = t;
        if (s.clicked) { s.k = 1; s.kx = ptr.x; s.kt = t; }
        s.k = Math.max(0, s.k - dt * .5);
        for (let i = 0; i < n; i++) {
          const f = i / (n - 1), base = H * (o.base || .5) + i * H * (.5 / n), amp = (o.amp || 26) * (1 - f * .4);
          ctx.beginPath(); ctx.moveTo(0, H);
          for (let x = 0; x <= W + 12; x += 12) {

    SCENE_PREVIEW[k] = kind === "sun" ? "radial-gradient(circle at 50% 50%, " + m.hi + " 0 12%, " + m.a + " 14%, transparent 45%), " + m.bg
      : kind === "waves" ? "linear-gradient(180deg, " + m.bg + " 45%, " + m.lo + ")"
      : kind === "grid" ? "repeating-linear-gradient(90deg, " + m.a + "55 0 1px, transparent 1px 12px), linear-gradient(180deg, " + m.bg + ", " + m.lo + "66)"
      : "radial-gradient(circle at 50% 110%, " + m.a + ", " + m.bg + " 70%)";
  }

  let scene = null;
  function sceneInit() {
    const def = SCENES[cur.scene];
    scene = def ? { def: def, s: {} } : null;
    if (!scene) return;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    def.init(scene.s);
  }
  function drawScene(t) {
    if (!scene) return;
    const s = scene.s;
    const dt = s.t ? Math.min(.066, Math.max(0, (t - s.t) / 1000)) : 0;
    s.t = t;
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    scene.def.draw(t, dt, s);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
  }

  /* ---------- LOOP + APPLY ---------- */
  function fpsFor(t) { return t.type === "ink" ? 16 : (t.type === "kelp" || t.type === "scene") ? 30 : 0; }

  function draw(t) {
    if (cur.type === "kelp") drawSea(t);
    else if (cur.type === "ink") drawInk(t);
    else if (cur.type === "scene") drawScene(t);
  }

  function updateCanvasVisibility() {
    // The photo/colour sits in #theme-bg; the canvas only takes over for ink,
    // or for the kelp sway once the photo has loaded.
    const show = cur.type === "ink" || cur.type === "scene" || (cur.type === "kelp" && imgOk && !reducedMotion);
    cv.style.display = show ? "block" : "none";
  }

  function size() {
    const dpr = Math.min(window.devicePixelRatio || 1, cur.type === "kelp" ? 2 : cur.type === "scene" ? 1.5 : 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (cur.type === "scene") sceneInit();
    draw(performance.now());
  }

  function loop(t) {
    animationId = null;
    const fps = fpsFor(cur);
    if (document.hidden || reducedMotion || !fps) return;
    if (t - lastFrame >= 1000 / fps) {
      lastFrame = t;
      draw(t);
    }
    animationId = requestAnimationFrame(loop);
  }
  function startAnimation() {
    if (reducedMotion || document.hidden || animationId !== null || !fpsFor(cur)) return;
    animationId = requestAnimationFrame(loop);
  }
  function stopAnimation() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
  }

  function apply(id, save) {
    cur = MAP[id] || MAP.ink;
    const v = varsOf(cur);
    for (const k in v) root.style.setProperty(k, v[k]);
    themeBg.style.backgroundColor = v["--bg"];
    const img = cur.type === "kelp" ? KELP_IMAGE : (cur.image || "");
    themeBg.style.backgroundImage = img ? 'url("' + img + '")' : "none";
    themeBg.style.display = cur.type === "ink" ? "none" : "block";
    updateCanvasVisibility();
    stopAnimation();
    size();
    startAnimation();
    if (save) { try { localStorage.setItem(STORE, cur.id); } catch (e) {} }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopAnimation();
    else startAnimation();
  });
  window.addEventListener("resize", size);

  let saved = "ink";
  try { saved = localStorage.getItem(STORE) || "ink"; } catch (e) {}
  apply(MAP[saved] ? saved : "ink", false);

  return {
    list: THEMES,
    current: () => cur,
    set: id => apply(id, true),
    vars: varsOf,
    kelpImage: KELP_IMAGE,
    preview: t => SCENE_PREVIEW[t.scene] || ""
  };
})();

/* SETTINGS: THEME PICKER */
const themeSearch = document.getElementById("theme-search");
const themeGridBg = document.getElementById("theme-grid-bg");
const themeGridColor = document.getElementById("theme-grid-color");
const rowBg = document.getElementById("row-bg");
const rowColor = document.getElementById("row-color");
const themeEmpty = document.getElementById("theme-empty");

function themeCard(t) {
  const v = Themes.vars(t);
  const on = Themes.current().id === t.id;
  const card = document.createElement("button");
  card.className = "game theme-card" + (on ? " active" : "");
  card.setAttribute("aria-pressed", on ? "true" : "false");
  card.addEventListener("click", () => { Themes.set(t.id); renderThemes(); });

  const icon = document.createElement("div");
  icon.className = "icon";
  icon.style.background = t.type === "kelp"
    ? 'url("' + Themes.kelpImage + '") center / cover no-repeat, ' + v["--bg"]
    : (Themes.preview(t) || v["--bg"]);

  const aa = document.createElement("span");
  aa.className = "sw-aa";
  aa.textContent = "Aa";
  aa.style.fontFamily = t.font;
  aa.style.backgroundImage = "linear-gradient(180deg, " + v["--g1"] + ", " + v["--g2"] + ")";

  const dots = document.createElement("span");
  dots.className = "sw-dots";
  t.sw.forEach(col => {
    const d = document.createElement("i");
    d.style.background = col;
    dots.appendChild(d);
  });
  icon.append(aa, dots);

  const name = document.createElement("div");
  name.className = "name";
  name.textContent = t.name;
  card.append(icon, name);
  return card;
}

function renderThemes() {
  const q = themeSearch.value.trim().toLowerCase();
  const list = Themes.list.filter(t => t.name.toLowerCase().includes(q));
  const bgs = list.filter(t => t.type !== "color");
  const cols = list.filter(t => t.type === "color");
  themeGridBg.innerHTML = "";
  themeGridColor.innerHTML = "";
  bgs.forEach(t => themeGridBg.appendChild(themeCard(t)));
  cols.forEach(t => themeGridColor.appendChild(themeCard(t)));
  rowBg.hidden = !bgs.length;
  rowColor.hidden = !cols.length;
  themeGridBg.style.display = bgs.length ? "" : "none";
  themeGridColor.style.display = cols.length ? "" : "none";
  themeEmpty.hidden = list.length > 0;
}
themeSearch.addEventListener("input", renderThemes);
renderThemes();

/* DRAGGABLE SIDEBAR
   Grab the panel anywhere except a button and drag it. The spot is remembered,
   and double-clicking the panel puts it back in the corner. */
(function () {
  const sb = document.getElementById("sidebar");
  const KEY = "obscura-sidebar-pos";
  let drag = null;

  function place(x, y) {
    const r = sb.getBoundingClientRect();
    const nx = Math.min(Math.max(0, x), Math.max(0, window.innerWidth - r.width));
    const ny = Math.min(Math.max(0, y), Math.max(0, window.innerHeight - r.height));
    sb.style.left = nx + "px";
    sb.style.top = ny + "px";
  }
  function save() {
    try {
      const r = sb.getBoundingClientRect();
      localStorage.setItem(KEY, JSON.stringify({ x: r.left, y: r.top }));
    } catch (e) {}
  }

  try {
    const p = JSON.parse(localStorage.getItem(KEY) || "null");
    if (p && typeof p.x === "number" && typeof p.y === "number") place(p.x, p.y);
  } catch (e) {}

  sb.title = "Drag to move. Double-click to reset.";

  sb.addEventListener("pointerdown", e => {
    if (e.button !== 0 || e.target.closest("button")) return;
    const r = sb.getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    sb.setPointerCapture(e.pointerId);
    sb.classList.add("dragging");
    e.preventDefault();
  });
  sb.addEventListener("pointermove", e => {
    if (drag) place(e.clientX - drag.dx, e.clientY - drag.dy);
  });
  function end() {
    if (!drag) return;
    drag = null;
    sb.classList.remove("dragging");
    save();
  }
  sb.addEventListener("pointerup", end);
  sb.addEventListener("pointercancel", end);

  sb.addEventListener("dblclick", e => {
    if (e.target.closest("button")) return;
    sb.style.left = "";
    sb.style.top = "";
    try { localStorage.removeItem(KEY); } catch (err) {}
  });

  window.addEventListener("resize", () => {
    if (!sb.style.left) return;           // still in its default corner
    const r = sb.getBoundingClientRect();
    place(r.left, r.top);
  });
})();
</script>
