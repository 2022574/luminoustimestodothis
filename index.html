/* GRADIENT TEXT */

h1, .version, .row-title, .name, .bar .title, .empty {

@media (max-width: 600px) {

@media (prefers-reduced-motion: reduce) {

</style>

<script>
const OPEN_MODE = "embed";

const GAMES = [

  { name: "PEAK - webport", icon: "icons/peakthegame.jpeg", url: "https://2022574.github.io/peak/?cdn=https%3A%2F%2Fcdn.jsdelivr.net%2Fgh%2Fwasmdotrip%2FPeak-Port%40main" },
  { name: "Feed Grow Fish - webport", icon: "icons/feedgrowfish.jpeg", url: "https://293701987.github.io/feedgrowfishsopeak/" },
  { name: "Forager - webport", icon: "icons/forager.jpeg", url: "https://6s4bpxwk47dwm0cx.05k.lambda-web.us-east-2.on.aws/" },

const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const player = document.getElementById("player");
const frame = document.getElementById("frame");
const home = document.getElementById("home");
const gamesPage = document.getElementById("games-page");
const sidebar = document.getElementById("sidebar");
const homeTab = document.getElementById("home-tab");
const gamesTab = document.getElementById("games-tab");

let currentGame = null;

/* NAVIGATION */

function showPage(page) {
  closeGame(false);

  const onHome = page === "home";
  home.style.display = onHome ? "flex" : "none";
  gamesPage.classList.toggle("active", !onHome);

  homeTab.classList.toggle("active", onHome);
  gamesTab.classList.toggle("active", !onHome);

  document.title = onHome ? "Obscura" : "Games (v1.7.35)";
  sidebar.classList.remove("open");
}

homeTab.addEventListener("click", () => showPage("home"));
gamesTab.addEventListener("click", () => showPage("games"));

/* SIDEBAR: 1.5 SECOND HOVER DELAY */

const edge = document.getElementById("edge-trigger");
let sidebarTimer = null;
let sidebarCloseTimer = null;

function cancelSidebarTimers() {
  clearTimeout(sidebarTimer);
  clearTimeout(sidebarCloseTimer);
}

edge.addEventListener("mouseenter", () => {
  if (player.classList.contains("open")) return;

  clearTimeout(sidebarCloseTimer);
  clearTimeout(sidebarTimer);

  sidebarTimer = setTimeout(() => {
    if (!player.classList.contains("open")) {
      sidebar.classList.add("open");
    }
  }, 1500);
});

edge.addEventListener("mouseleave", () => {
  clearTimeout(sidebarTimer);
  sidebarCloseTimer = setTimeout(() => {
    if (!sidebar.matches(":hover")) sidebar.classList.remove("open");
  }, 350);
});

sidebar.addEventListener("mouseenter", () => {
  clearTimeout(sidebarCloseTimer);
  clearTimeout(sidebarTimer);
});

sidebar.addEventListener("mouseleave", () => {
  sidebarCloseTimer = setTimeout(() => {
    sidebar.classList.remove("open");
  }, 350);
});

/* Touch devices: tap the left edge to toggle the sidebar */
edge.addEventListener("click", () => {
  if (player.classList.contains("open")) return;
  sidebar.classList.toggle("open");
});

/* ABOUT:BLANK */

function openBlank(url, title) {
  const w = window.open("about:blank", "_blank");
  if (!w) {
    alert("Your browser blocked the pop-up. Allow pop-ups for this site and try again.");
    return;
  }

  w.document.title = title;
  w.document.body.style.cssText = "margin:0;height:100vh;overflow:hidden;background:#000";

  const f = w.document.createElement("iframe");
  f.src = url;
  f.style.cssText = "border:0;width:100%;height:100%";
  f.allow = "fullscreen; autoplay; gamepad; clipboard-write";
  f.setAttribute("allowfullscreen", "");
  w.document.body.appendChild(f);
}

document.getElementById("blankSite").onclick = () => openBlank(location.href, "Obscura");
document.getElementById("blankGame").onclick = () => {
  if (currentGame) openBlank(currentGame.url, currentGame.name);
};

/* GAME PLAYER */

function openGame(g) {
  currentGame = g;

  // Forager does not allow embedding, so open it directly.
  if (g.name.toLowerCase().includes("forager")) {
    window.location.href = g.url;
    return;
  }

  if (OPEN_MODE === "tab") {
    window.open(g.url, "_blank", "noopener");
    return;
  }

  cancelSidebarTimers();
  sidebar.classList.remove("open");

  document.getElementById("ptitle").textContent = g.name;
  document.getElementById("newtab").href = g.url;

  frame.src = g.url;
  player.classList.add("open");
  document.title = g.name;
}

function closeGame(returnToPage = true) {
  if (document.fullscreenElement && document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }

  player.classList.remove("open");
  player.classList.remove("fs", "show");
  frame.src = "about:blank";
  currentGame = null;

  if (returnToPage) {
    document.title = gamesPage.classList.contains("active")
      ? "Games (v1.7.35)"
      : "Obscura";
  }
}

document.getElementById("back").onclick = () => closeGame();

document.addEventListener("keydown", e => {
  if (e.key === "Escape" &&
      player.classList.contains("open") &&
      !document.fullscreenElement) {
    closeGame();
  }
});

/* GAME GRID */

function render(list) {
  grid.innerHTML = "";
  empty.hidden = list.length > 0;

  list.forEach(g => {
    const card = document.createElement("button");
    card.className = "game";
    card.addEventListener("click", () => openGame(g));

    const icon = document.createElement("div");
    icon.className = "icon";

    const img = new Image();
    img.alt = g.name;
    img.loading = "lazy";
    img.decoding = "async";
    img.onerror = () => {
      img.remove();
      icon.textContent = g.name.charAt(0).toUpperCase();
    };
    img.src = g.icon;
    icon.appendChild(img);

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = g.name;

    card.append(icon, name);
    grid.appendChild(card);
  });
}

document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  render(GAMES.filter(g => g.name.toLowerCase().includes(q)));
});

render(GAMES);

/* FULLSCREEN TOP BAR */

const fsBtn = document.getElementById("fs");
const hot = document.getElementById("hot");
let hideTimer = null;

fsBtn.onclick = () => {
  if (document.fullscreenElement) {
    document.exitFullscreen();
  } else if (player.requestFullscreen) {
    player.requestFullscreen().catch(() => {
      alert("Fullscreen is blocked here. Try Open in new tab and use fullscreen from the game page.");
    });
  } else {
    alert("This browser does not support fullscreen.");
  }
};

document.addEventListener("fullscreenchange", () => {
  const on = document.fullscreenElement === player;

  player.classList.toggle("fs", on);
  player.classList.remove("show");

  fsBtn.textContent = on ? "Exit fullscreen" : "Fullscreen";

  if (navigator.keyboard && navigator.keyboard.lock) {
    if (on) navigator.keyboard.lock(["Escape"]).catch(() => {});
    else navigator.keyboard.unlock();
  }
});

function showBar() {
  clearTimeout(hideTimer);
  player.classList.add("show");
}

function hideBar() {
  player.classList.remove("show");
}

hot.addEventListener("mouseenter", showBar);

hot.addEventListener("click", () => {
  showBar();
  hideTimer = setTimeout(hideBar, 3500);
});

document.querySelector(".bar").addEventListener("mouseleave", hideBar);

/* OPTIMIZED BACKGROUND
   Same flowing black-and-white woven appearance,
   but fewer strands, fewer points, lower resolution,
   and a capped frame rate to reduce CPU/GPU usage.
*/

(function () {
  const cv = document.getElementById("bg");
  const ctx = cv.getContext("2d", { alpha: false });

  let W = 0;
  let H = 0;
  let dpr = 1;
  let lastFrame = 0;
  let animationId = null;

  const FPS = 30;
  const FRAME_INTERVAL = 1000 / FPS;

  function size() {
    // Lower rendering resolution saves GPU resources.
    dpr = Math.min(window.devicePixelRatio || 1, 1.25);

    W = window.innerWidth;
    H = window.innerHeight;

    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw(performance.now());
  }

  const bundles = [];

  for (let b = 0; b < 5; b++) {
    bundles.push({
      y: (b + .5) / 5,
      amp: 50 + Math.random() * 90,
      f: .0025 + Math.random() * .003,
      sp: .25 + Math.random() * .35,
      ph: Math.random() * 6.28,
      tilt: (Math.random() - .5) * .25,
      gap: 6 + Math.random() * 4,
      n: 7
    });
  }

  function draw(t) {
    ctx.fillStyle = "#030303";
    ctx.fillRect(0, 0, W, H);

    const g = ctx.createRadialGradient(
      W * .5, H * .4, 0,
      W * .5, H * .4, Math.max(W, H) * .8
    );

    g.addColorStop(0, "rgba(255,255,255,.07)");
    g.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = "round";

    for (const bd of bundles) {
      for (let i = 0; i < bd.n; i++) {
        const k = i - (bd.n - 1) / 2;

        ctx.beginPath();

        // Larger horizontal steps mean fewer calculations.
        for (let x = -20; x <= W + 20; x += 18) {
          const weave = 1 + .9 * Math.sin(x * bd.f * .7 + bd.ph + t * .0002);

          const y = bd.y * H
            + bd.tilt * (x - W / 2)
            + Math.sin(x * bd.f + bd.ph + t * .001 * bd.sp) * bd.amp
            + Math.sin(x * bd.f * 2.3 + i * .5 + t * .0014 * bd.sp) * bd.amp * .22
            + k * bd.gap * weave;

          if (x === -20) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }

        const edge = 1 - Math.abs(k) / (bd.n / 2);
        ctx.strokeStyle = "rgba(255,255,255," + (.06 + edge * .3) + ")";
        ctx.lineWidth = .8 + edge * 2.2;
        ctx.stroke();
      }
    }
  }

  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function loop(t) {
    animationId = null;

    if (document.hidden || reducedMotion) return;

    if (t - lastFrame >= FRAME_INTERVAL) {
      lastFrame = t;
      draw(t);
    }

    animationId = requestAnimationFrame(loop);
  }

  function startAnimation() {
    if (reducedMotion || document.hidden || animationId !== null) return;
    animationId = requestAnimationFrame(loop);
  }

  function stopAnimation() {
    if (animationId !== null) {
      cancelAnimationFrame(animationId);
      animationId = null;
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) stopAnimation();
    else startAnimation();
  });

  window.addEventListener("resize", size);

  size();
  startAnimation();
})();
</script>
</body>
